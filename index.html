    }).catch(function () { delete BALH['_' + key]; BALH[key] = { dates: [], ids: [], values: [] }; if (keys[1]) BALH[keys[1]] = BALH[key]; });
  }
  function isoDay(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function histWindow(key) {
    const st = S.hist[key] || { r: '1M' }, t = S.data.meta.today;
    if (st.r === 'C') return { from: st.from || isoDay(new Date(today().getTime() - 30 * 864e5)), to: st.to || t, st: st };
    const r = HRANGES.filter(function (x) { return x.k === st.r; })[0] || HRANGES[1];
    const f = new Date(today()); f.setDate(f.getDate() - r.d);
    return { from: isoDay(f), to: t, st: st };
  }
  /** Builds [{date, v, v2?, parts:{id:val}}] for the page's table, honouring the owner / market filter. */
  function histPoints(view, from, to) {
    const key = histKey(view), market = isStockView(view) ? STOCK_VIEWS[view] : '';
    const rows = S.data.tables[key] || [];
    const meta = {}; rows.forEach(function (r) { meta[r.id] = r; });
    const okRow = function (id) {
      const r = meta[id];
      if (market && (!r || r.market !== market)) return false;
      if (S.owner !== 'All' && ownerKey(key)) return !!r && r[ownerKey(key)] === S.owner;
      return true;
    };
    const filtered = !!market || (S.owner !== 'All' && !!ownerKey(key));
    const byDate = {};
    // 1) per-account history recorded by the server
    const H = BALH[key];
    if (H && H.dates) H.dates.forEach(function (d, i) {
      if (d < from || d > to) return;
      const parts = {}; let v = 0;
      H.ids.forEach(function (id, j) { const x = H.values[i][j]; if (x != null && okRow(id)) { parts[id] = x; v += x; } });
      byDate[d] = { date: d, v: v, parts: parts };

  /** Money-weighted annual return (XIRR) from dated cash flows. */
  function xirr(flows) {

  function parsePreset(str) {
    const d = { order: [], size: {}, tall: {}, hidden: [] };
    String(str || PRESETS.classic).split(/\s+/).forEach(function (t) {
      const p = t.split(':'); if (!MODS[p[0]]) return;

  function dashLayout() {

    const base = parsePreset(PRESETS[key] || PRESETS.classic);
    if (!saved || !Array.isArray(saved.order)) return base;
    const d = { order: saved.order.filter(function (k) { return MODS[k]; }), size: Object.assign({}, base.size, saved.size || {}), tall: saved.tall || {}, hidden: (saved.hidden || []).filter(function (k) { return MODS[k]; }) };
    Object.keys(MODS).forEach(function (k) {
      if (d.order.indexOf(k) !== -1) return;
      if (AUTO_SHOW.indexOf(k) !== -1) d.order.unshift(k); else { d.order.push(k); d.hidden.push(k); }

  /* ======================================================================
   *  CASH FLOW · TRANSACTIONS · BUDGETING

  const CAT_COLORS = ['#5b4ce0', '#ff7a45', '#14b8a6', '#f43f6b', '#e0a100', '#0ea5e9', '#8b5cf6', '#22c55e', '#ec4899', '#64748b', '#f97316', '#06b6d4'];
  function catColor(n) { let h = 7; String(n || '').split('').forEach(function (c) { h = (h * 33 + c.charCodeAt(0)) >>> 0; }); return CAT_COLORS[h % CAT_COLORS.length]; }
  function catDot(n) { return '<span class="cdot" style="background:' + catColor(n) + '"></span>'; }
  function txs() { return S.data.txSummary || { months: [], byCat: {}, categories: [], accounts: [], recent: [], count: 0 }; }
  function monthKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function monthLabel(k, long) { const p = k.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('en-US', long ? { month: 'long', year: 'numeric' } : { month: 'short', year: '2-digit' }); }
  function addMonths(k, n) { const p = k.split('-'); return monthKey(new Date(+p[0], +p[1] - 1 + n, 1)); }
  function monthRow(k) { return txs().months.filter(function (m) { return m.month === k; })[0] || { month: k, income: 0, spending: 0, net: 0, count: 0 }; }
  function spentIn(k, cat) {
    const m = txs().byCat[k] || {}, n = norm(cat);
    let s = 0;
    Object.keys(m).forEach(function (c) { if (norm(c) === n) s += m[c]; });
    return Math.max(0, s);
  }
  function avg3(cat, k) { let s = 0; for (let i = 1; i <= 3; i++) s += spentIn(addMonths(k, -i), cat); return s / 3; }
  function curMonth() { return monthKey(today()); }

  /* ---------- Bar chart (income / spending bars + net line) ---------- */
  function drawBars(el, cfg) {
    const W = el.clientWidth, Hh = el.clientHeight || 280;
    const padL = 54, padR = 12, padT = 18, padB = 30, w = W - padL - padR, h = Hh - padT - padB;
    const pts = cfg.points, n = pts.length;
    let hi = 0, lo = 0;
    pts.forEach(function (p) { hi = Math.max(hi, p.income, p.spending, p.net); lo = Math.min(lo, p.net); });
    if (hi === lo) hi = lo + 100;
    const step = niceStep((hi - lo) / 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const Y = function (v) { return padT + (1 - (v - lo) / (hi - lo)) * h; };
    const band = w / n, bw = Math.max(3, Math.min(16, band * 0.3));
    const cx = function (i) { return padL + band * (i + 0.5); };
    let svg = '<svg width="' + W + '" height="' + Hh + '">';
    for (let v = lo; v <= hi + 1e-6; v += step) {
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (Math.abs(v) < 1e-6 ? '#dcd9ec' : '#efeef6') + '"/>' +
        '<text x="' + (padL - 10) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="#9a99b3">' + shortMoney(v) + '</text>';
    }
    const every = Math.ceil(n / Math.max(2, Math.floor(w / 64)));
    pts.forEach(function (p, i) {
      const x = cx(i), y0 = Y(0);
      svg += '<rect x="' + (x - bw - 2) + '" y="' + Y(p.income) + '" width="' + bw + '" height="' + Math.max(0, y0 - Y(p.income)) + '" rx="' + Math.min(5, bw / 2) + '" fill="#5b4ce0"/>';
      svg += '<rect x="' + (x + 2) + '" y="' + Y(p.spending) + '" width="' + bw + '" height="' + Math.max(0, y0 - Y(p.spending)) + '" rx="' + Math.min(5, bw / 2) + '" fill="#ff7a45"/>';
      if (i % every === 0 || i === n - 1) svg += '<text x="' + x + '" y="' + (Hh - 8) + '" text-anchor="middle" font-size="11" fill="#9a99b3">' + esc(monthLabel(p.month)) + '</text>';
    });
    const line = pts.map(function (p, i) { return [cx(i), Y(p.net)]; });
    if (n > 1) svg += '<path d="' + monoPath(line) + '" fill="none" stroke="#ffb81c" stroke-width="3" stroke-linecap="round"/>';
    line.forEach(function (q) { svg += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="3.5" fill="#fff" stroke="#ffb81c" stroke-width="2.5"/>'; });
    svg += '<rect class="hl" x="0" y="' + padT + '" width="' + band + '" height="' + h + '" fill="#5b4ce0" opacity="0" rx="10"/>';
    svg += '<rect x="' + padL + '" y="' + padT + '" width="' + w + '" height="' + h + '" fill="transparent" class="hov"/></svg>';
    el.innerHTML = recolor(svg, true) + '<div class="tip" hidden></div>';
    const tip = el.querySelector('.tip'), hl = el.querySelector('.hl'), hov = el.querySelector('.hov');
    function show(clientX) {
      const r = el.getBoundingClientRect();
      const i = Math.max(0, Math.min(n - 1, Math.floor((clientX - r.left - padL) / band)));
      const p = pts[i];
      hl.setAttribute('x', padL + band * i); hl.setAttribute('opacity', 0.06);
      tip.hidden = false;
      tip.innerHTML = '<b>' + esc(monthLabel(p.month, true)) + '</b>' +
        '<div style="margin-top:3px">Income: ' + money(p.income, true) + '</div><div>Spending: ' + money(p.spending, true) + '</div>' +
        '<div style="font-weight:700">Net: ' + money(p.net, true) + '</div>';
      tip.style.left = Math.min(Math.max(cx(i), 80), W - 80) + 'px';
      tip.style.top = Math.min(Y(Math.max(p.income, p.spending, p.net)), Hh - 60) + 'px';
    }
    hov.addEventListener('mousemove', function (e) { show(e.clientX); });
    hov.addEventListener('touchstart', function (e) { show(e.touches[0].clientX); }, { passive: true });
    hov.addEventListener('mouseleave', function () { tip.hidden = true; hl.setAttribute('opacity', 0); });
  }

  function flowPoints(range) {
    const all = txs().months;
    if (!all.length) return [];
    const last = curMonth() > all[all.length - 1].month ? curMonth() : all[all.length - 1].month;
    const n = { '6M': 6, '1Y': 12, '2Y': 24, 'All': 999 }[range] || 12;
    let first = all[0].month;
    const minFirst = addMonths(last, -(n - 1));
    if (first < minFirst) first = minFirst;
    const out = [];
    for (let k = first; k <= last; k = addMonths(k, 1)) out.push(monthRow(k));
    return out;
  }

  function budgetMiniCard() {

  function ring(v, total, size) {

    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '"><circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="#f0eff7" stroke-width="12"/>' +
      '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (pct * C) + ' ' + C + '" transform="rotate(-90 ' + s / 2 + ' ' + s / 2 + ')"/>' +
      '<text x="50%" y="50%" dy="5" text-anchor="middle" font-size="' + Math.round(s / 5.5) + '" font-weight="700" fill="#1e1b4b">' + (total ? Math.round(v / total * 100) : 0) + '%</text></svg>';

  function filteredTx() {
    const f = S.txF, q = S.search.trim().toLowerCase();
    return (S.tx || []).filter(function (t) {
      if (f.month !== 'all' && t.date.slice(0, 7) !== f.month) return false;
      if (f.cat !== 'all' && t.category !== f.cat) return false;
      if (f.acct !== 'all' && t.account !== f.acct) return false;
      if (f.kind !== 'all' && t.kind !== f.kind) return false;
      if (q && (t.description + ' ' + t.category + ' ' + t.account + ' ' + t.tags).toLowerCase().indexOf(q) === -1) return false;

      .sort(function (a, b) { return b.v - a.v; }).slice(0, 8);
    const max = top.length ? top[0].v : 1;

  /* ---------- CSV import ---------- */
  const IM = {};
  const IM_FIELDS = [
    { k: 'date', label: 'Date', req: true, alias: ['date', 'transaction date', 'posted date', 'posting date', 'trans. date'] },
    { k: 'description', label: 'Description', req: true, alias: ['description', 'payee', 'merchant', 'name', 'original description', 'memo'] },
    { k: 'amount', label: 'Amount', alias: ['amount', 'transaction amount', 'amount (usd)'] },
    { k: 'debit', label: 'Debit (money out)', alias: ['debit', 'withdrawal', 'withdrawals', 'debit amount'] },
    { k: 'credit', label: 'Credit (money in)', alias: ['credit', 'deposit', 'deposits', 'credit amount'] },
    { k: 'category', label: 'Category', alias: ['category', 'transaction category'] },
    { k: 'account', label: 'Account', alias: ['account', 'account name', 'card'] },
    { k: 'tags', label: 'Tags', alias: ['tags', 'labels', 'tag'] }
  ];

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
  }
  function toISO(s) {
    s = String(s || '').trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    const f = function (y, mo, d) { return y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2); };
    if (m) return f(m[1], m[2], m[3]);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return f(y, m[1], m[2]); }
    const d = new Date(s);
    return isNaN(d) ? null : f(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }
  function parseAmt(s) {
    s = String(s == null ? '' : s).trim();
    if (!s) return null;
    const neg = /^\(.*\)$/.test(s) || /^-/.test(s.replace(/[$\s]/g, '')) || /-$/.test(s);
    const n = parseFloat(s.replace(/[^0-9.]/g, ''));
    return isFinite(n) ? (neg ? -n : n) : null;
  }

  function openImport() {
    openModal('Import Transactions', '<div class="drop" id="drop"><div class="ih-ic">' + icon('upload', 30, 2) + '</div>' +
      '<b>Drop your CSV here</b><span>or</span><label class="btn sm">Choose file<input type="file" id="csvFile" accept=".csv,text/csv" hidden></label>' +
      '<small>Empower / Personal Capital: <i>Transactions → Download CSV</i> (Date, Account, Description, Category, Tags, Amount).<br>Re-importing overlapping files is safe: duplicates are skipped.</small></div>', 820);
    const drop = $('drop');
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
    $('csvFile').addEventListener('change', function (e) { if (e.target.files[0]) readFile(e.target.files[0]); });
  }

  function readFile(file) {
    const r = new FileReader();
    r.onload = function () {
      const rows = parseCSV(String(r.result));
      let h = 0;
      for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const low = rows[i].map(function (x) { return String(x).trim().toLowerCase(); });
        if (low.indexOf('date') !== -1 || low.some(function (x) { return /date/.test(x); })) { h = i; break; }
      }
      IM.fileName = file.name;
      IM.headers = rows[h] ? rows[h].map(function (x) { return String(x).trim(); }) : [];
      IM.data = rows.slice(h + 1);
      IM.map = {};
      IM_FIELDS.forEach(function (f) {
        const low = IM.headers.map(function (x) { return x.toLowerCase(); });
        let idx = -1;
        f.alias.some(function (a) { idx = low.indexOf(a); return idx !== -1; });
        IM.map[f.k] = idx;
      });
      IM.account = '';
      const built = buildImportRows(false);
      const pos = built.rows.filter(function (x) { return x.amount > 0; }).length;
      IM.flip = built.rows.length > 5 && pos / built.rows.length > 0.7; // most rows positive → probably spending is positive
      renderImport();
    };
    r.readAsText(file);
  }

  function buildImportRows(flip) {
    const m = IM.map, rows = [], seen = {};
    let bad = 0;
    IM.data.forEach(function (r) {
      const date = m.date >= 0 ? toISO(r[m.date]) : null;
      let amt = m.amount >= 0 ? parseAmt(r[m.amount]) : null;
      if (amt === null && (m.debit >= 0 || m.credit >= 0)) {
        const cr = m.credit >= 0 ? parseAmt(r[m.credit]) : null, db = m.debit >= 0 ? parseAmt(r[m.debit]) : null;
        if (cr !== null || db !== null) amt = Math.abs(cr || 0) - Math.abs(db || 0);
      }
      const desc = m.description >= 0 ? String(r[m.description] || '').trim() : '';
      if (!date || amt === null || !isFinite(amt)) { bad++; return; }
      if (flip) amt = -amt;
      const account = (m.account >= 0 ? String(r[m.account] || '').trim() : '') || IM.account;
      const base = [date, amt.toFixed(2), norm(desc), norm(account)].join('|');
      seen[base] = (seen[base] || 0) + 1;
      rows.push({ key: base + '#' + seen[base], date: date, amount: Math.round(amt * 100) / 100, description: desc || '(no description)',
        category: m.category >= 0 ? String(r[m.category] || '').trim() : '', account: account, tags: m.tags >= 0 ? String(r[m.tags] || '').trim() : '' });
    });
    return { rows: rows, bad: bad };
  }

  function renderImport() {
    const b = buildImportRows(IM.flip), rows = b.rows;
    const out = rows.filter(function (r) { return r.amount < 0; }).reduce(function (a, r) { return a - r.amount; }, 0);
    const inn = rows.filter(function (r) { return r.amount > 0; }).reduce(function (a, r) { return a + r.amount; }, 0);
    const dates = rows.map(function (r) { return r.date; }).sort();
    const opts = function (sel) {
      return '<option value="-1">— none —</option>' + IM.headers.map(function (h, i) { return '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + esc(h || ('Column ' + (i + 1))) + '</option>'; }).join('');
    };
    const ok = IM.map.date >= 0 && (IM.map.amount >= 0 || IM.map.debit >= 0 || IM.map.credit >= 0) && rows.length;
    $('modalBody').innerHTML =
      '<div class="imp-file">' + icon('sheet', 18) + '<b>' + esc(IM.fileName) + '</b><span class="muted">' + IM.data.length.toLocaleString() + ' data rows</span>' +
        '<button type="button" class="btn ghost sm" id="imBack" style="margin-left:auto">Choose another file</button></div>' +
      '<div class="h-stats" style="grid-template-columns:repeat(4,1fr)"><div>Ready to import<b>' + rows.length.toLocaleString() + '</b></div>' +
        '<div>Date range<b style="font-size:13px">' + (dates.length ? fmtDate(dates[0]) + ' – ' + fmtDate(dates[dates.length - 1]) : '—') + '</b></div>' +
        '<div>Money out<b class="num">' + money(out, true) + '</b></div><div>Money in<b class="num pos">' + money(inn, true) + '</b></div></div>' +
      (b.bad ? '<div class="muted" style="font-size:12px;margin:-8px 0 12px">' + b.bad + ' rows skipped (missing date or amount).</div>' : '') +
      '<details class="imp-map"' + (ok ? '' : ' open') + '><summary>Column mapping</summary><div class="form-grid" style="grid-template-columns:repeat(4,1fr);margin-top:12px">' +
        IM_FIELDS.map(function (f) { return '<div class="field"><label>' + f.label + (f.req ? ' <span class="req">*</span>' : '') + '</label><select data-imap="' + f.k + '">' + opts(IM.map[f.k]) + '</select></div>'; }).join('') +
        '<div class="field"><label>Account if missing</label><input id="imAcct" value="' + esc(IM.account) + '" placeholder="e.g. Chase Checking"></div>' +
      '</div></details>' +
      '<label class="check-inline" style="margin:12px 0"><input type="checkbox" id="imFlip"' + (IM.flip ? ' checked' : '') + '> Flip signs (use if your file shows spending as <b>positive</b> numbers). Spending should appear as −.</label>' +
      '<div class="table-scroll" style="max-height:260px;border:1px solid var(--line);border-radius:14px"><table class="data"><thead><tr><th class="nosort">Date</th><th class="nosort">Description</th><th class="nosort">Category</th><th class="nosort">Account</th><th class="nosort r">Amount</th></tr></thead><tbody>' +
        rows.slice(0, 8).map(function (r) {
          return '<tr><td>' + esc(fmtDate(r.date)) + '</td><td>' + esc(r.description) + '</td><td>' + (r.category ? catDot(r.category) + esc(r.category) : '<span class="muted">Uncategorized</span>') + '</td><td class="muted">' + esc(r.account || '—') + '</td>' +
            '<td class="r num" style="font-weight:700;color:' + (r.amount > 0 ? '#16a34a' : 'inherit') + '">' + (r.amount > 0 ? '+' : '−') + money(Math.abs(r.amount)) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
      '<div class="form-actions"><button type="button" class="btn ghost" id="imCancel">Cancel</button>' +
        '<button type="button" class="btn orange" id="imGo"' + (ok ? '' : ' disabled') + '>' + icon('upload', 15) + ' Import ' + rows.length.toLocaleString() + ' transactions</button></div>';
    $('modalBody').querySelectorAll('[data-imap]').forEach(function (s) { s.onchange = function () { IM.map[s.getAttribute('data-imap')] = Number(s.value); renderImport(); }; });
    $('imAcct').onchange = function () { IM.account = this.value.trim(); renderImport(); };
    $('imFlip').onchange = function () { IM.flip = this.checked; renderImport(); };
    $('imBack').onclick = openImport;
    $('imCancel').onclick = closeModal;
    $('imGo').onclick = function () { doImport(rows); };
  }

  function doImport(rows) {
    const btn = $('imGo'), CH = 1500, src = 'CSV: ' + IM.fileName;
    let i = 0, added = 0, skipped = 0;
    btn.disabled = true; $('imCancel').disabled = true;
    function next() {
      const chunk = rows.slice(i, i + CH), lastChunk = i + CH >= rows.length;
      btn.innerHTML = '<span class="spinner sm"></span> Importing ' + Math.min(i + CH, rows.length).toLocaleString() + ' / ' + rows.length.toLocaleString() + '…';
      call('importTransactions', chunk, src, lastChunk).then(function (res) {
        added += res.added; skipped += res.skipped; i += CH;
        if (!lastChunk) return next();
        closeModal();
        S.tx = null;
        apply(res.data);
        toast('Imported ' + added.toLocaleString() + ' transactions' + (skipped ? ' · ' + skipped.toLocaleString() + ' duplicates skipped' : ''), 'ok');
        if (S.view === 'transactions') loadTx(true);
      }).catch(function (e) {
        toast((e && e.message) || String(e), 'err');
        btn.disabled = false; $('imCancel').disabled = false; btn.textContent = 'Retry import';
      });
    }
    next();
  }

  function budgetPageHtml() {
    const k = S.bMonth, b = (S.data.budgets || []).slice(), m = monthRow(k);

    b.forEach(function (x) { budgeted[norm(x.category)] = 1; });

    const ts = b.reduce(function (a, x) { return a + spentIn(k, x.category); }, 0);
    const unb = Object.keys(spentMap).filter(function (c) { return !budgeted[norm(c)] && spentMap[c] > 0; })
      .map(function (c) { return { c: c, s: spentMap[c], avg: avg3(c, k) }; }).sort(function (a, z) { return z.s - a.s; });
    const unbTotal = unb.reduce(function (a, x) { return a + x.s; }, 0);
    // days left
    const isCur = k === curMonth(), d = today();
    const dim = new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();
    const left = isCur ? dim - d.getDate() + 1 : 0;

    const summary = '<div class="card bsum">' + ring(ts, tb, 150) +
      '<div class="bsum-grid">' +
        '<div><small>Budgeted</small><b class="num">' + money(tb, true) + '</b></div>' +
        '<div><small>Spent (budgeted)</small><b class="num">' + money(ts, true) + '</b></div>' +
        '<div><small>' + (tb - ts >= 0 ? 'Remaining' : 'Over budget') + '</small><b class="num ' + (tb - ts >= 0 ? 'pos' : 'neg') + '">' + money(Math.abs(tb - ts), true) + '</b></div>' +
        '<div><small>Unbudgeted spending</small><b class="num">' + money(unbTotal, true) + '</b></div>' +
        '<div><small>Income this month</small><b class="num">' + money(m.income, true) + '</b></div>' +
        '<div><small>' + (isCur ? 'Days left · per day' : 'Total spending') + '</small><b class="num">' + (isCur ? left + ' · ' + money(Math.max(tb - ts, 0) / Math.max(left, 1), true) : money(m.spending, true)) + '</b></div>' +
      '</div></div>';

    const cards = b.length ? '<div class="bgrid">' + b.map(function (x) {
      const s = spentIn(k, x.category), pct = x.amount ? s / x.amount * 100 : 0, over = s > x.amount, c = catColor(x.category);
      const col = over ? '#f43f6b' : pct > 80 ? '#ff7a45' : '#16a34a';
      return '<div class="card bcard"><div class="bc-h"><span class="av" style="background:' + c + '">' + esc(initials(x.category)) + '</span>' +
        '<div class="t"><b>' + esc(x.category) + '</b><small>' + (x.notes ? esc(x.notes) + ' · ' : '') + 'avg 3 mo ' + money(avg3(x.category, k), true) + '</small></div>' +
        '<button type="button" class="icon-btn" title="Edit" data-act="budget-edit" data-cat="' + esc(x.category) + '">' + icon('edit', 15) + '</button>' +
        '<button type="button" class="icon-btn del" title="Delete" data-act="budget-del" data-cat="' + esc(x.category) + '">' + icon('trash', 15) + '</button></div>' +
        '<div class="bc-v"><b class="num">' + money(s, true) + '</b><span class="muted"> of ' + money(x.amount, true) + '</span><span class="bc-p" style="color:' + col + '">' + Math.round(pct) + '%</span></div>' +
        '<div class="bar" style="height:10px"><span style="width:' + Math.min(pct, 100) + '%;background:' + col + '"></span></div>' +
        '<div class="bc-f ' + (over ? 'neg' : '') + '">' + (over ? money(s - x.amount, true) + ' over budget' : money(x.amount - s, true) + ' left') + '</div></div>';
    }).join('') + '</div>'
      : '<div class="card"><div class="empty">No budgets yet. Add one, or set budgets from the categories below (pre-filled with your 3-month average).</div></div>';

    const unbCard = '<div class="card" style="margin-top:20px"><div class="card-h"><h3>Unbudgeted Spending</h3><span class="sub">' + esc(monthLabel(k, true)) + ' · categories without a budget</span></div>' +
      (unb.length ? '<div class="list">' + unb.map(function (x) {
        return '<div class="li">' + '<span class="av sm" style="background:' + catColor(x.c) + '">' + esc(initials(x.c)) + '</span>' +
          '<div class="t"><b>' + esc(x.c) + '</b><small>avg 3 mo ' + money(x.avg, true) + '</small></div><div class="amt num">' + money(x.s, true) + '</div>' +
          '<button type="button" class="btn ghost sm" data-act="budget-set" data-cat="' + esc(x.c) + '">Set budget</button></div>';
      }).join('') + '</div>' : '<div class="empty">' + (txs().count ? 'Every category with spending has a budget.' : 'Import transactions to track spending against budgets.') + '</div>') +
      '<div class="muted" style="font-size:11.5px;margin-top:10px">Not counted: category <b>Transfers</b> (and credit-card payments) and anything tagged <b>Reimbursable</b>.</div></div>';

    return summary + cards + unbCard;
  }

  function buildAlerts() {
    const t = S.data.tables, out = [];
    t.credit.forEach(function (r) {
      const d = daysUntil(r.aprDue);
      if (d !== null && d < 0) out.push({ lvl: 0, c: '#be123c', bg: '#ffe4e6', ic: 'alert', k: 'credit', id: r.id, t: r.name + ': 0% APR expired', s: 'Ended ' + fmtDate(r.aprDue) + ' · ' + money(r.balance) });
      else if (d !== null && d <= 30 && cardDebt(r) > 0) out.push({ lvl: 1, c: '#c2410c', bg: '#ffedd5', ic: 'clock', k: 'credit', id: r.id, t: r.name + ': 0% APR ends in ' + d + ' day' + (d === 1 ? '' : 's'), s: 'Balance ' + money(r.balance) });
      if (r.status === 'UNPAID') out.push({ lvl: 0, c: '#be123c', bg: '#ffe4e6', ic: 'card', k: 'credit', id: r.id, t: r.name + ' is UNPAID', s: 'Balance ' + money(r.balance) });
    });
    t.checking.forEach(function (r) {
      if (r.actionPlan === 'IMMEDIATELY CLOSE') out.push({ lvl: 0, c: '#fff', bg: '#be123c', ic: 'x', k: 'checking', id: r.id, t: 'Close ' + r.name + ' immediately', s: r.nextStep || 'Action plan: IMMEDIATELY CLOSE' });
      if (r.updated === 'Not Updated') out.push({ lvl: 1, c: '#c2410c', bg: '#ffedd5', ic: 'refresh', k: 'checking', id: r.id, t: r.name + ' not updated', s: 'Owner: ' + (r.owner || '—') });
    });
    t.checking.forEach(function (r) {
      if (Number(r.bonus) > 0 && r.bonusRedeemed !== 'Yes') out.push({ lvl: 2, c: '#4338ca', bg: '#e0e7ff', ic: 'gift', k: 'checking', id: r.id, t: 'Bonus pending: ' + r.name, s: money(r.bonus) + ' not redeemed yet' });
    });
    t.credit.forEach(function (r) {
      if (Number(r.bonusRemaining) > 0 && r.bonusRedeemed !== 'Yes') out.push({ lvl: 2, c: '#4338ca', bg: '#e0e7ff', ic: 'gift', k: 'credit', id: r.id, t: 'Bonus pending: ' + r.name, s: money(r.bonusRemaining) + ' not redeemed yet' });
    });
    t.credit.forEach(function (r) {
      if (!(Number(r.bonusSpend) > 0) || r.bonusRedeemed === 'Yes' || !r.bonusDeadline) return;
      const d = daysUntil(r.bonusDeadline), left = r.bonusSpend - (r.bonusSpent || 0);
      if (left > 0 && d >= 0 && d <= 30) out.push({ lvl: d <= 7 ? 0 : 1, c: '#c2410c', bg: '#ffedd5', ic: 'gift', k: 'credit', id: r.id, t: r.name + ': ' + money(left, true) + ' spend left for bonus', s: d + ' days left · deadline ' + fmtDate(r.bonusDeadline) });
    });
    t.credit.forEach(function (r) {
      if (r.util != null && r.util > 30) out.push({ lvl: r.util > 70 ? 0 : 1, c: '#be123c', bg: '#ffe4e6', ic: 'card', k: 'credit', id: r.id, t: r.name + ': ' + r.util + '% utilization', s: money(r.balance) + ' of ' + money(r.creditLimit, true) + ' limit · keep it under 30% before the statement closes' });
    });
    if (S.data.summary.utilization != null && S.data.summary.utilization > 30) out.push({ lvl: 1, c: '#be123c', bg: '#ffe4e6', ic: 'card', k: 'credit', id: '', t: 'Total credit utilization ' + S.data.summary.utilization + '%', s: 'Over 30% of ' + money(S.data.summary.creditLimit, true) + ' total limit' });
    t.checking.forEach(function (r) {
      if (!r.safeClose || r.closedOn || r.actionPlan === 'Closed' || r.actionPlan === 'Leave Open') return;
      const d = daysUntil(r.safeClose);
      if (d <= 0) out.push({ lvl: 1, c: '#047857', bg: '#d1fae5', ic: 'check', k: 'checking', id: r.id, t: r.name + ' is safe to close', s: 'Kept open ' + r.keepOpenDays + ' days (since ' + fmtDate(r.dateOpened) + ') · no early-closure fee' });
      else if (d <= 14) out.push({ lvl: 2, c: '#4338ca', bg: '#e0e7ff', ic: 'clock', k: 'checking', id: r.id, t: r.name + ': safe to close in ' + d + ' day' + (d === 1 ? '' : 's'), s: 'On ' + fmtDate(r.safeClose) });
    });
    t.credit.forEach(function (r) {
      const d = r.nextFee ? daysUntil(r.nextFee) : null;
      if (d !== null && d >= 0 && d <= 30) out.push({ lvl: d <= 7 ? 0 : 1, c: '#c2410c', bg: '#ffedd5', ic: 'calendar', k: 'credit', id: r.id, t: r.name + ': annual fee ' + money(r.annualFee, true) + ' in ' + d + ' day' + (d === 1 ? '' : 's'), s: 'Ask for a retention offer, downgrade or close before ' + fmtDate(r.nextFee) });
    });
    if (canR('rewards')) {
      (t.rewards || []).forEach(function (r) {
        if (Number(r.minPayout) > 0 && Number(r.balance) >= Number(r.minPayout)) out.push({ lvl: 1, c: '#047857', bg: '#d1fae5', ic: 'gift', k: 'rewards', id: r.id, t: 'Cash out ' + r.name, s: money(r.balance) + ' — over the ' + money(r.minPayout, true) + ' minimum' });
      });
      const stale = (t.rewards || []).filter(function (r) { return r.status !== 'Closed' && (!r.updatedOn || daysUntil(r.updatedOn) < -60); });
      if (stale.length) out.push({ lvl: 2, c: '#047857', bg: '#d1fae5', ic: 'refresh', k: 'rewards', id: '', t: stale.length + ' reward app' + (stale.length === 1 ? '' : 's') + ' not checked in 60+ days', s: 'Open them, update Balance and “Balance Checked On”' });
    }
    (S.data.recurring || []).forEach(function (r) {
      if (r.priceUp && !r.ignored) out.push({ lvl: 2, c: '#be123c', bg: '#ffe4e6', ic: 'repeat', k: 'recurring', id: '', t: r.name + ' price went up ' + r.change + '%', s: 'Now ' + money(r.last) + ' · ' + r.freq });
    });
    return out.sort(function (a, b) { return a.lvl - b.lvl; });
  }

  /* ======================================================================
   *  PAGES (tables)
   * ==================================================================== */
  function visibleRows(k) {
    let rows = S.data.tables[k].slice();
    const ok = ownerKey(k);
    if (S.owner !== 'All' && ok) rows = rows.filter(function (r) { return r[ok] === S.owner; });
    const q = S.search.trim().toLowerCase();
    if (q) {
      rows = rows.filter(function (r) {
        return schema(k).columns.some(function (c) { return c.type !== 'id' && String(r[c.key] == null ? '' : r[c.key]).toLowerCase().indexOf(q) !== -1; });
      });
    }
    const st = S.sort[k];
    if (st) {
      const c = col(k, st.key);
      const numeric = ['currency', 'number', 'history'].indexOf(c.type) !== -1 || (c.type === 'formula' && c.format !== 'date');
      rows.sort(function (a, b) {
        let x = a[st.key], y = b[st.key];
        if (numeric) { x = Number(x) || 0; y = Number(y) || 0; } else { x = String(x || '').toLowerCase(); y = String(y || '').toLowerCase(); }
        return (x < y ? -1 : x > y ? 1 : 0) * st.dir;
      });
    }
    return rows;
  }

  function totalsFor(k, rows) {
    return (schema(k).totals || []).map(function (t) {
      const v = rows.reduce(function (a, r) {
        if (t.where && r[t.where.key] !== t.where.value) return a;
        if (t.whereNot && r[t.whereNot.key] === t.whereNot.value) return a;
        if (schema(k).deal && t.key === 'total') return a + dealTotal(r);
        const key = k === 'mortgage' && t.key === 'balance' ? 'balanceEff' : t.key;
        return a + (Number(r[key]) || 0);
      }, 0);
      return { label: t.label, key: t.key, value: v, where: t.where, noFoot: t.noFoot };

  /* ======================================================================
   *  MORTGAGE
   * ==================================================================== */
  /** Month-by-month payoff from today. Returns months, total interest, payoff date and sampled rows. */
  function amortize(balance, ratePct, pi, extra) {
    const i = (Number(ratePct) || 0) / 100 / 12, pay = (Number(pi) || 0) + (Number(extra) || 0);
    let bal = Number(balance) || 0, m = 0, ti = 0, tp = 0;
    const d0 = today(), rows = [{ date: S.data.meta.today, balance: bal, interest: 0, principal: 0 }];
    if (bal <= 0 || pay <= bal * i) return { months: bal > 0 ? Infinity : 0, interest: 0, payoff: null, rows: rows };
    while (bal > 0.005 && m < 720) {
      const int = bal * i, prin = Math.min(pay - int, bal);
      bal -= prin; ti += int; tp += prin; m++;
      if (m % 3 === 0 || bal <= 0.005) {
        const d = new Date(d0.getFullYear(), d0.getMonth() + m, 1);
        rows.push({ date: d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-01', balance: Math.max(bal, 0), interest: ti, principal: tp });
      }
    }
    const pd = new Date(d0.getFullYear(), d0.getMonth() + m, 1);
    return { months: m, interest: ti, payoff: pd, rows: rows };
  }
  function fmtMonths(n) { if (!isFinite(n)) return 'never'; const y = Math.floor(n / 12), m = n % 12; return (y ? y + ' yr ' : '') + (m ? m + ' mo' : (y ? '' : '0 mo')); }

  /* ======================================================================
   *  CARD BONUS & 0% APR PLANNER
   * ==================================================================== */
  function monthsUntil(iso) {
    const d = parseISO(iso), t = today();
    if (!d) return null;
    let m = (d.getFullYear() - t.getFullYear()) * 12 + d.getMonth() - t.getMonth();
    if (d.getDate() < t.getDate()) m--;
    return m;
  }
  /* ======================================================================
   *  CREDIT CARD ACCOUNTS — overview · cards / list views · detail drawer
   * ==================================================================== */
  const ISSUER_STYLE = {   // neutral identity marks (monogram + hue), not brand logos
    'Chase': ['CH', '#1f5fbf'], 'American Express': ['AX', '#2a7fb8'], 'Citi': ['CI', '#1c6fb5'], 'Capital One': ['C1', '#a3343f'],
    'Bank of America': ['BA', '#c0392b'], 'U.S. Bank': ['US', '#1f3a7a'], 'Wells Fargo': ['WF', '#b8322a'], 'Barclays': ['BC', '#1d8fc9'],
    'Discover': ['DI', '#e8771f'], 'Truist': ['TR', '#4b2a7b'], 'PNC': ['PN', '#e06c1f'], 'TD Bank': ['TD', '#2f8a3b'], 'Synchrony': ['SY', '#c6a225'],
    'Bilt': ['BI', '#222222'], 'Apple': ['AP', '#6b7280']
  };
  function issuerMark(r, size) {
    const st = ISSUER_STYLE[r.issuer] || [String(r.issuer || r.name || '?').replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase() || '?', '#64748b'];
    return '<span class="iss" style="--iss:' + st[1] + (size ? ';--sz:' + size + 'px' : '') + '" title="' + esc(r.issuer || 'Issuer not set') + '">' + esc(st[0]) + '</span>';
  }
  function ccUtilT() { const t = planGet('utilT', [10, 30, 50]); return Array.isArray(t) && t.length === 3 ? t.map(Number) : [10, 30, 50]; }
  function ccUtilBand(u) {
    const t = ccUtilT();
    if (u == null) return { k: 'na', l: 'No limit set' };
    return u < t[0] ? { k: 'ex', l: 'Excellent' } : u < t[1] ? { k: 'gd', l: 'Good' } : u < t[2] ? { k: 'md', l: 'Moderate' } : { k: 'hi', l: 'High' };
  }
  function ccCardName(r) {   // "04 - John Chase Inc Unlimited XXXX7743" → "John Chase Inc Unlimited"
    return String(r.name || '').replace(/^\s*\d+\s*[-–.]\s*/, '').replace(/\s*(x{2,}|\*{2,}|•+)\s*\d{3,4}\s*$/i, '').replace(/\s*[-–]\s*$/, '').trim() || r.name;
  }
  function ccFacts(r) {
    const debt = cardDebt(r), lim = Number(r.creditLimit) || 0, closed = !!r.closedOn;
    const promoDays = r.aprDue ? daysUntil(r.aprDue) : null, promoOn = promoDays !== null && promoDays >= 0;
    const due = r.nextDue ? daysUntil(r.nextDue) : null;
    const flags = [];
    if (r.overdue) flags.push({ k: 'bad', l: 'Overdue' });
    else if (r.status === 'UNPAID') flags.push({ k: 'bad', l: 'Unpaid' });
    if (!r.overdue && due !== null && due >= 0 && due <= 7 && r.status !== 'PAID' && (debt > 0 || Number(r.minPayment) > 0)) flags.push({ k: 'warn', l: due === 0 ? 'Due today' : 'Due in ' + due + 'd' });
    if (r.util != null && r.util >= ccUtilT()[2]) flags.push({ k: 'warn', l: 'High utilization' });
    if (promoOn && promoDays <= 60 && debt > 0) flags.push({ k: 'warn', l: '0% ends in ' + promoDays + 'd' });
    if (promoDays !== null && promoDays < 0 && debt > 0) flags.push({ k: 'bad', l: 'Promo APR ended' });
    return { debt: debt, lim: lim, avail: lim ? Math.max(0, lim - debt) : null, util: r.util, closed: closed, promoOn: promoOn, promoDays: promoDays, due: due, flags: flags,
      attention: flags.length > 0 };
  }
  function ccSorted(rows) {
    const s = S.ccSort || 'balance', by = {
      balance: function (a, b) { return cardDebt(b) - cardDebt(a); }, balanceAsc: function (a, b) { return cardDebt(a) - cardDebt(b); },
      util: function (a, b) { return (b.util == null ? -1 : b.util) - (a.util == null ? -1 : a.util); },
      due: function (a, b) { return (a.nextDue || '9999') < (b.nextDue || '9999') ? -1 : (a.nextDue || '9999') > (b.nextDue || '9999') ? 1 : 0; },
      limit: function (a, b) { return (Number(b.creditLimit) || 0) - (Number(a.creditLimit) || 0); },
      apr: function (a, b) { return (Number(b.apr) || -1) - (Number(a.apr) || -1); },
      promo: function (a, b) { const x = a.aprDue && daysUntil(a.aprDue) >= 0 ? a.aprDue : '9999', y = b.aprDue && daysUntil(b.aprDue) >= 0 ? b.aprDue : '9999'; return x < y ? -1 : x > y ? 1 : 0; },
      issuer: function (a, b) { return String(a.issuer || 'zz').localeCompare(String(b.issuer || 'zz')) || ccCardName(a).localeCompare(ccCardName(b)); },
      name: function (a, b) { return String(a.name).localeCompare(String(b.name)); }
    };
    return rows.slice().sort(by[s] || by.balance);
  }
  function ccFiltered(all) {

  function utilRing(u, size, label) {

    return '<section class="cc-ov">' +
      '<div class="ov-main"><div class="ov-bal"><small>Total balance</small><b class="num">' + money(debt) + '</b>' +

    const t = S.data.meta.today, from = months ? addMonthsISO(t, -months) : addDaysISO(t, -days);
    const hits = cards.filter(function (r) { return (!issuer || r.issuer === issuer) && r.dateOpened && r.dateOpened > from && r.dateOpened <= t; })
      .sort(function (a, b) { return a.dateOpened < b.dateOpened ? 1 : -1; });
    const ok = hits.length < max;
    const after = ok ? '' : addDaysISO(months ? addMonthsISO(hits[max - 1].dateOpened, months) : addDaysISO(hits[max - 1].dateOpened, days), 1);
    return { label: label, ok: ok, n: hits.length, max: max, after: after };
  }
  function cardToolsHtml() { const p = cardToolsParts(); return p.rules ? '<div class="tools2">' + p.rules + p.fees + '</div>' + p.util : ''; }
  function cardToolsParts() {
    const all = S.data.tables.credit || [];
    if (!all.length) return { rules: '', fees: '', util: '' };
    const owners = (S.data.owners || []).concat(['']).filter(function (o) { return all.some(function (r) { return (r.owner || '') === o; }); });
    const shown = S.owner !== 'All' ? owners.filter(function (o) { return o === S.owner; }) : owners;
    const dated = all.filter(function (r) { return r.dateOpened; }).length;
    const guessed = all.some(function (r) { return r.issuerGuess || r.typeGuess; });
    const people = shown.map(function (o) {
      const cards = all.filter(function (r) { return (r.owner || '') === o; });
      const x = rule524(cards), under = x.n < 5;
      const rules = [
        windowRule(cards, 'Chase', 30, 2, 'Chase 2/30'),
        windowRule(cards, 'American Express', 90, 2, 'Amex 2/90'),
        windowRule(cards, 'Citi', 8, 1, 'Citi 1/8'),
        windowRule(cards, 'Citi', 65, 2, 'Citi 2/65'),
        windowRule(cards, 'Capital One', 0, 1, 'Capital One 1/6 mo', 6),
        windowRule(cards, 'Bank of America', 0, 2, 'BofA 2/2 mo', 2),
        windowRule(cards, 'Bank of America', 0, 3, 'BofA 3/12 mo', 12),
        windowRule(cards, 'Bank of America', 0, 4, 'BofA 4/24 mo', 24)
      ].filter(function (q) { return q.n > 0; });
      return '<div class="r524"><div class="r524-h"><div class="r524-n ' + (under ? 'ok' : 'bad') + '"><b>' + x.n + '</b><small>/24</small></div><div><b>' + esc(o || 'No owner') + '</b>' +
        '<small>' + (under ? 'Under 5/24 — ' + (5 - x.n) + ' slot' + (5 - x.n === 1 ? '' : 's') + ' free for Chase' : 'At 5/24 — Chase approvals likely denied until <b>' + esc(fmtDate(x.okOn)) + '</b>') +
        (x.nextDrop && x.nextDrop > S.data.meta.today ? ' · next card drops off ' + esc(fmtDate(x.nextDrop)) : '') + '</small></div></div>' +
        (x.list.length ? '<div class="r524-list">' + x.list.map(function (r) {
          return '<span class="r524-c" data-act="edit" data-id="' + esc(r.id) + '" title="' + esc(r.issuer || '') + ' · opened ' + esc(r.dateOpened) + '">' + esc(r.name) + '<small>' + esc(fmtDate(r.dateOpened)) + ' → ' + esc(fmtDate(addMonthsISO(r.dateOpened, 24))) + '</small></span>';
        }).join('') + '</div>' : '') +
        (rules.length ? '<div class="r524-rules">' + rules.map(function (q) {
          return '<span class="rr ' + (q.ok ? 'ok' : 'bad') + '">' + esc(q.label) + ': ' + (q.ok ? 'OK' : 'wait until ' + esc(fmtDate(q.after))) + '</span>';
        }).join('') + '</div>' : '') + '</div>';
    }).join('');
    // annual fees
    const fees = all.filter(function (r) { return r.nextFee && (S.owner === 'All' || r.owner === S.owner); }).sort(function (a, b) { return a.nextFee < b.nextFee ? -1 : 1; });
    const yearly = fees.reduce(function (a, r) { return a + (Number(r.annualFee) || 0); }, 0);
    const feeHtml = fees.length ? '<div class="af-list">' + fees.map(function (r) {
      const d = daysUntil(r.nextFee);

        '<div class="t"><b>' + esc(r.name) + '</b><small>' + esc(r.owner || '—') + (r.feeDate ? '' : ' · estimated from Date Opened') + (d <= 30 ? ' · call for a retention offer or downgrade before it posts' : '') + '</small></div>' +
        '<div class="v num">' + money(r.annualFee) + '</div></div>';
    }).join('') + '</div>' : '<div class="empty" style="padding:18px">Fill <b>Annual Fee ($)</b> (and optionally <b>Next Annual Fee Date</b>) on your cards to see the calendar. Without a date, the anniversary of <b>Date Opened</b> is used.</div>';
    // utilization
    const lim = all.filter(function (r) { return Number(r.creditLimit) > 0 && !r.closedOn && (S.owner === 'All' || r.owner === S.owner); }).sort(function (a, b) { return (b.util || 0) - (a.util || 0); });
    const totLim = lim.reduce(function (a, r) { return a + Number(r.creditLimit); }, 0), totUsed = lim.reduce(function (a, r) { return a + Math.abs(Math.min(0, Number(r.balance) || 0)); }, 0);
    const totU = totLim ? totUsed / totLim * 100 : 0;
    const bar = function (u) { const c = u > 70 ? '#e11d48' : u > 30 ? '#f97316' : '#10b981'; return '<div class="ut-bar"><i style="width:' + Math.min(100, u) + '%;background:' + c + '"></i><s></s></div>'; };
    const utilHtml = '<div class="card ut-card"><div class="card-h"><h3>' + icon('card', 16) + ' Credit utilization</h3><span class="sub">balances ÷ credit limits · aim for under 30% (under 10% is best) when statements close</span></div>' +
      (lim.length ? '<div class="ut-tot"><div><small>Total</small><b class="num' + (totU > 30 ? ' neg' : '') + '">' + totU.toFixed(1) + '%</b><small>' + money(totUsed, true) + ' of ' + money(totLim, true) + '</small></div>' + bar(totU) + '</div>' +
        '<div class="ut-list">' + lim.map(function (r) { const u = r.util || 0; return '<div class="ut" data-act="edit" data-id="' + esc(r.id) + '"><span class="t"><b>' + esc(r.name) + '</b><small>' + esc(r.owner || '—') + ' · ' + money(Math.abs(Math.min(0, Number(r.balance) || 0)), true) + ' / ' + money(r.creditLimit, true) + '</small></span>' + bar(u) + '<b class="num">' + u.toFixed(0) + '%</b></div>'; }).join('') + '</div>'
        : '<div class="empty" style="padding:16px">Fill <b>Credit Limit ($)</b> on your cards to see utilization.</div>') + '</div>';
    return { rules: '<div class="card"><div class="card-h"><h3>' + icon('shield', 16) + ' Chase 5/24 &amp; issuer rules</h3><span class="sub">personal cards opened in the last 24 months · ' + dated + '/' + all.length + ' cards have Date Opened</span></div>' +
        people +
        '<div class="muted r524-note">Business cards don\'t count, except Capital One, Discover and TD. Authorized-user cards and cards you no longer list here also count but aren\'t tracked.' +
        (guessed ? ' Issuer and Personal/Business are guessed from the card name where empty — set them in the table to be exact.' : '') +
        ' Issuer rules are common community data points, not official policy.</div></div>', fees: '<div class="card"><div class="card-h"><h3>' + icon('calendar', 16) + ' Annual fee calendar</h3><span class="sub">' + fees.length + ' card' + (fees.length === 1 ? '' : 's') + ' · ' + money(yearly) + ' / year</span></div>' + feeHtml + '</div>', util: utilHtml };
  }

  function plannerHtml(rows) {

      .sort(function (a, b) { return (a.bonusDeadline || '9') < (b.bonusDeadline || '9') ? -1 : 1; });
    const apr = rows.filter(function (r) { return cardDebt(r) > 0 && r.aprDue; })
      .map(function (r) { const m = monthsUntil(r.aprDue), debt = cardDebt(r); return { r: r, m: m, debt: debt, pay: m >= 0 ? debt / Math.max(1, m + 1) : debt }; })
      .sort(function (a, b) { return a.r.aprDue < b.r.aprDue ? -1 : 1; });
    const perMonth = apr.filter(function (x) { return x.m >= 0; }).reduce(function (a, x) { return a + x.pay; }, 0);

    const bBody = bonus.length ? bonus.map(function (r) {
      const req = Number(r.bonusSpend), spent = Number(r.bonusSpent) || 0, pct = Math.min(spent / req * 100, 100), met = spent >= req;
      const d = r.bonusDeadline ? daysUntil(r.bonusDeadline) : null, left = Math.max(req - spent, 0);

        '<div class="pr-f">' + status + '<span class="muted">Bonus ' + money(r.bonus, true) + (r.bonusDeadline ? ' · by ' + fmtDate(r.bonusDeadline, true) : '') + '</span></div></div>';
    }).join('') : '<div class="empty">Add <b>Bonus Min Spend</b> and <b>Bonus Spend Deadline</b> to a card to track it here.<br>Spending is counted from your Transactions (matching the card name or “Account Name in Transactions”).</div>';

        '<div class="pr-f">' + (exp ? '<span class="tag" style="background:#ffe4e6;color:#be123c">0% APR ended ' + fmtDate(r.aprDue, true) + ' · interest may apply</span>'

          '<span class="muted">' + (exp ? '' : 'ends ' + fmtDate(r.aprDue)) + '</span></div></div>';
    }).join('') : '<div class="empty">No balances on 0% APR cards.</div>';

      '<div class="card"><div class="card-h"><h3>Bonus Tracker</h3><span class="sub">minimum spend progress</span>' +

      '<div class="card"><div class="card-h"><h3>0% APR Payoff Plan</h3><span class="sub">pay these to clear before the promo ends</span>' +

  /* ======================================================================
   *  CASH FLOW FORECAST
   * ==================================================================== */
  const STEP_DAYS = { 'Weekly': 7, 'Every 2 weeks': 14, 'Twice a month': 15.2, 'Monthly': 30.4, 'Quarterly': 91, 'Yearly': 365 };
  function isoOf(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function occurrences(r, from, to) {
    const out = [];
    let d = parseISO(r.nextDate);
    if (!d) return out;
    if (r.dom && r.dom.length) {
      for (let mo = -1; mo <= 40; mo++) {
        r.dom.forEach(function (dd) {
          const c = new Date(from.getFullYear(), from.getMonth() + mo, Math.min(dd, 28));
          if (c >= from && c <= to && c >= new Date(parseISO(r.nextDate).getTime() - 5 * 86400000)) out.push(c);
        });
      }
      return out;
    }
    const step = (STEP_DAYS[r.freq] || 30.4) * 86400000;
    while (d < from) d = new Date(d.getTime() + step);
    while (d <= to) { out.push(new Date(d.getFullYear(), d.getMonth(), d.getDate())); d = new Date(d.getTime() + step); }
    return out;
  }
  function forecastRun(months, everyday) {
    const from = today(), to = new Date(from.getFullYear(), from.getMonth() + months, from.getDate());
    const events = [];
    (S.data.recurring || []).forEach(function (r) { if (!r.ignored) occurrences(r, from, to).forEach(function (d) { events.push({ d: d, desc: r.name, amt: -r.last, type: 'Bill' }); }); });
    (S.data.recurringIncome || []).forEach(function (r) { if (!r.ignored) occurrences(r, from, to).forEach(function (d) { events.push({ d: d, desc: r.name, amt: r.avg, type: 'Income' }); }); });
    (S.data.planned || []).forEach(function (p) {
      let d = parseISO(p.date);
      const stepM = p.repeat === 'Monthly' ? 1 : p.repeat === 'Yearly' ? 12 : 0;
      while (d && d < from && stepM) d = new Date(d.getFullYear(), d.getMonth() + stepM, d.getDate());
      while (d && d <= to) {
        if (d >= from) events.push({ d: d, desc: p.description, amt: p.amount, type: 'Planned', id: p.id });
        if (!stepM) break;
        d = new Date(d.getFullYear(), d.getMonth() + stepM, d.getDate());
      }
    });
    events.sort(function (a, b) { return a.d - b.d; });
    const perDay = everyday ? (S.data.forecast || {}).everydayPerDay || 0 : 0;
    let bal = S.data.summary.checking, idx = 0, min = { bal: bal, d: from }, tin = 0, tout = 0;
    const pts = [];
    for (let d = new Date(from); d <= to; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
      bal -= perDay; tout += perDay;
      while (idx < events.length && isoOf(events[idx].d) === isoOf(d)) {
        const e = events[idx]; bal += e.amt; e.bal = bal;
        if (e.amt > 0) tin += e.amt; else tout -= e.amt;
        idx++;
      }
      pts.push({ date: isoOf(d), bal: Math.round(bal * 100) / 100 });
      if (bal < min.bal) min = { bal: bal, d: new Date(d) };
    }
    return { pts: pts, events: events, min: min, end: bal, tin: tin, tout: tout, perDay: perDay, to: to };
  }

  function dealClass(r) {
    if (r.redeemed === 'Yes') return 'redeemed';
    if (r.status === 'Declined' || r.status === 'Expired' || r.result === 'Declined') return 'closed';
    if (r.status === 'Applied' || r.status === 'Pending') return 'pending';
    return 'available';
  }
  function dealYear(r) { return (r.redeemDate || r.appDate || '').slice(0, 4) || 'No date'; }
  function dealStats(rows) {
    const s = { available: 0, availableN: 0, pending: 0, pendingN: 0, redeemed: 0, redeemedN: 0, closedN: 0, years: {} };
    rows.forEach(function (r) {
      const c = dealClass(r), v = dealTotal(r);
      if (c === 'available') { s.available += v; s.availableN++; }
      else if (c === 'pending') { s.pending += v; s.pendingN++; }
      else if (c === 'redeemed') {
        s.redeemed += v; s.redeemedN++;
        const y = dealYear(r);
        const o = s.years[y] = s.years[y] || { total: 0, n: 0, by: {} };
        o.total += v; o.n++; o.by[r.applyFor || '—'] = (o.by[r.applyFor || '—'] || 0) + v;
      } else s.closedN++;
    });
    return s;
  }
  function dealsSummaryHtml(k, rows) {
    const s = dealStats(rows);
    const other = k === 'dealsCC' ? 'dealsChecking' : 'dealsCC';
    const all = dealStats(S.data.tables.dealsCC.concat(S.data.tables.dealsChecking));
    const tile = function (cls, ic, label, val, sub, f) {
      return '<button type="button" class="tile deal-tile' + (S.dealF === f ? ' on' : '') + '" data-dealf="' + f + '"><div class="ic ' + cls + '">' + icon(ic, 20, 2.2) + '</div>' +
        '<div><div class="l">' + label + '</div><div class="v num">' + val + '</div><div class="s">' + sub + '</div></div></button>';
    };
    const years = Object.keys(s.years).sort().reverse();
    const maxY = Math.max.apply(null, years.map(function (y) { return s.years[y].total; }).concat([1]));
    const yearCard = '<div class="card deal-years"><div class="card-h"><h3>Redeemed by Year</h3><span class="sub">by Redeem Date (Application Date if empty)</span></div>' +
      (years.length ? years.map(function (y) {
        const o = s.years[y];
        return '<div class="cat"><div class="row"><div><b>' + esc(y) + '</b><small>' + o.n + ' bonus' + (o.n === 1 ? '' : 'es') + ' · ' +
          Object.keys(o.by).map(function (p) { return esc(p) + ' ' + money(o.by[p], true); }).join(' · ') + '</small></div><span class="num">' + money(o.total, true) + '</span></div>' +
          '<div class="bar"><span style="width:' + (o.total / maxY * 100) + '%;background:linear-gradient(90deg,#16a34a,#4ade80)"></span></div></div>';
      }).join('') : '<div class="empty">Nothing redeemed yet.</div>') + '</div>';
    return '<div class="grid deal-top"><div>' +
      '<div class="tiles deal-tiles">' +
        tile('i-violet', 'coins', 'Available + Redeemed', money(s.available + s.redeemed, true), money(s.available, true) + ' available · ' + money(s.redeemed, true) + ' redeemed', 'all') +
        tile('i-teal', 'gift', 'Available to apply', money(s.available, true), s.availableN + ' offers not applied yet / thinking', 'available') +
        tile('i-orange', 'clock', 'Pending', money(s.pending, true), s.pendingN + ' applied, bonus not received', 'pending') +
        tile('i-yellow', 'check', 'Redeemed', money(s.redeemed, true), s.redeemedN + ' bonuses received', 'redeemed') +
      '</div>' +
      '<div class="deal-all">All deals (Credit Card + Checking): <b>' + money(all.available + all.redeemed, true) + '</b> available + redeemed · <b>' + money(all.pending, true) + '</b> pending · <b>' + money(all.redeemed, true) + '</b> redeemed' +
        (s.closedN ? ' · <a href="#" class="link" data-dealf="closed">' + s.closedN + ' declined/expired here</a>' : '') + '</div>' +
      '</div>' + yearCard + '</div>';
  }
  function dealsPageHtml(k) {
    const rows = visibleRows(k);
    const shown = S.dealF === 'all' ? rows : rows.filter(function (r) { return dealClass(r) === S.dealF; });
    return dealsSummaryHtml(k, rows) + tableHtml(k, shown, totalsFor(k, shown));
  }

  /* ---------- Cashback (Checking bonus + Credit Card bonus + Refunds) ---------- */
  // Assets rows whose name contains one of these words count as "Refunds".
  const REFUND_NAMES = ['refund'];
  function isRefund(name) { const n = norm(name); return REFUND_NAMES.some(function (w) { return n.indexOf(w) !== -1; }); }
  function cashbackData() {
    const t = S.data.tables;
    const bonus = function (rows) {
      const tot = rows.reduce(function (a, r) { return a + (Number(r.bonus) || 0); }, 0);
      const red = rows.reduce(function (a, r) { return a + (r.bonusRedeemed === 'Yes' ? (Number(r.bonus) || 0) : 0); }, 0);
      return { total: tot, redeemed: red, pending: tot - red, count: rows.filter(function (r) { return Number(r.bonus) > 0; }).length };
    };
    const rf = t.assets.filter(function (r) { return isRefund(r.name); });
    const refunds = {
      total: rf.reduce(function (a, r) { return a + (Number(r.balance) || 0); }, 0),
      given: rf.reduce(function (a, r) { return a + (Number(r.given) || 0); }, 0),
      received: rf.reduce(function (a, r) { return a + (Number(r.received) || 0); }, 0),
      rows: rf
    };
    const cr = { total: t.credit.reduce(function (a, r) { return a + (Number(r.bonus) || 0); }, 0), redeemed: t.credit.reduce(function (a, r) { return a + (Number(r.redeemedAmt) || 0); }, 0),
      pending: t.credit.reduce(function (a, r) { return a + (Number(r.bonusRemaining) || 0); }, 0), count: t.credit.filter(function (r) { return Number(r.bonus) > 0; }).length };
    const rw = t.rewards || [];
    const rewards = { pending: rw.reduce(function (a, r) { return a + (Number(r.balance) || 0); }, 0), redeemed: rw.reduce(function (a, r) { return a + (Number(r.redeemed) || 0); }, 0) };
    const c = { checking: bonus(t.checking), credit: cr, refunds: refunds, rewards: rewards };
    // Only money still to come: pending checking bonus + unredeemed card bonus + refunds owed back + reward-app balances
    c.total = c.checking.pending + c.credit.pending + c.refunds.total + (canR('rewards') ? rewards.pending : 0);
    return c;
  }
  function cashbackHtml() {
    const c = cashbackData();
    const line = function (attrs, ic, cls, title, sub, v) {
      return '<button type="button" class="pop-line" ' + attrs + '><span class="tile-ic ' + cls + '">' + icon(ic, 17, 2.2) + '</span>' +
        '<span class="t"><b>' + title + '</b><small>' + sub + '</small></span><span class="v num">' + money(v) + '</span></button>';
    };
    const rf = c.refunds.rows;
    const refundAttrs = rf.length === 1 ? 'data-act="history" data-id="' + esc(rf[0].id) + '"' : 'data-act="noop"';
    const refundSub = rf.length
      ? 'Given ' + money(c.refunds.given, true) + ' · Received ' + money(c.refunds.received, true)
      : 'Add a person named “Refunds” in Assets';
    return '<div class="cash-wrap" id="cashWrap">' +
      '<button type="button" class="tile cash" data-act="cashback" aria-haspopup="true">' +
        '<div class="ic">' + icon('coins', 22, 2.2) + '</div>' +
        '<div><div class="l">Cashback</div><div class="v num">' + money(c.total) + '</div>' +
        '<div class="s">Pending checking bonus + card bonus + Refunds + reward apps ▾</div></div></button>' +
      '<div class="popover" id="cashPop" hidden>' +
        '<div class="pop-h">Cashback breakdown</div>' +
        line('data-view="checking"', 'bank', 'i-violet', 'Checking Bonus · pending',

          'Earned ' + money(c.credit.total, true) + ' · Redeemed ' + money(c.credit.redeemed, true) + ' (not counted)', c.credit.pending) +
        line(refundAttrs, 'refresh', 'i-teal', 'Refunds', refundSub, c.refunds.total) +

        '<div class="pop-total"><span>Total pending cashback</span><b class="num">' + money(c.total) + '</b></div>' +
      '</div></div>';
  }
