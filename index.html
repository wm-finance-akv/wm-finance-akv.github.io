  function tableHtml(k, rows, totals) {
    const def = schema(k);
    if (S.grid[k]) return '<div class="card table-card"><div class="card-h"><h3>' + esc(def.label) + '</h3><span class="sub">Excel mode · synced with the “' + esc(def.sheet) + '” sheet</span></div>' + gridHtml(k, rows) + '</div>';
    const cols = orderedCols(k);
    const st = S.sort[k] || {};
    const isNum = function (c) { return ['currency', 'number'].indexOf(c.type) !== -1 || (c.type === 'formula' && c.format !== 'date'); };
    const head = '<tr>' + cols.map(function (c) {
      const arrow = st.key === c.key ? '<span class="arrow">' + (st.dir > 0 ? '▲' : '▼') + '</span>' : '';
      const hdr = S.ccy === 'TRY' && tlRate() && (c.type === 'currency' || c.type === 'formula') ? c.header.replace('($', '(₺') : c.header;
      return '<th class="' + (isNum(c) ? 'r' : '') + (c.type === 'history' ? ' nosort' : '') + '" data-sort="' + c.key + '">' + esc(hdr) + arrow + '</th>';
    }).join('') + (k === 'turk' ? '<th class="nosort r">Value (₺ TL)</th>' : '') +
      extraCols(k).map(function (x) { return '<th class="nosort xh" title="Your own column in the “' + esc(def.sheet) + '” sheet (column ' + x.col + ')">' + esc(x.header) + '</th>'; }).join('') + '<th class="nosort r">Actions</th></tr>';

    const body = rows.length ? rows.map(function (r) {
      return '<tr>' + cols.map(function (c) { return cellHtml(k, c, r); }).join('') + (k === 'turk' ? '<td class="r num" style="color:#c2410c;font-weight:600">' + tl(r.balance) + '</td>' : '') + extraCells(k, r) +
        '<td><div class="row-actions">' +
          '<button type="button" class="icon-btn" title="Edit" data-act="edit" data-id="' + esc(r.id) + '">' + icon('edit', 16) + '</button>' +
          docBtn(k, r) +
          '<button type="button" class="icon-btn del" title="Delete" data-act="delete" data-id="' + esc(r.id) + '">' + icon('trash', 16) + '</button>' +
        '</div></td></tr>';
    }).join('') : '<tr><td colspan="' + (cols.length + 1 + (k === 'turk' ? 1 : 0) + extraCols(k).length) + '"><div class="empty">' +
      (S.data.tables[k].length ? 'No rows match your filter.' : 'Nothing here yet — click <b>Add ' + esc(singular(k)) + '</b>.') + '</div></td></tr>';

    const foot = '<tr>' + cols.map(function (c, i) {
      if (i === 0) return '<td>TOTAL (' + rows.length + ')</td>';
      const t = totals.filter(function (x) { return x.key === c.key && !x.where && !x.noFoot; })[0];
      if (!t) {
        const red = totals.filter(function (x) { return x.where && x.where.key === c.key; })[0];
        return red ? '<td class="num">Redeemed ' + money(red.value) + '</td>' : '<td></td>';
      }
      return '<td class="r num">' + money(t.value) + '</td>';
    }).join('') + (k === 'turk' ? '<td class="r num">' + tl(totals[0] ? totals[0].value : 0) + '</td>' : '') + extraCols(k).map(function () { return '<td></td>'; }).join('') + '<td></td></tr>';

    return '<div class="card table-card"><div class="card-h"><h3>' + esc(def.label) + '</h3><span class="sub">' + rows.length + (rows.length === 1 ? ' row' : ' rows') + ' · synced with the “' + esc(def.sheet) + '” sheet</span>' +
      '<div class="right"><button type="button" class="btn ghost sm" data-act="grid-on" data-gk="' + k + '">' + icon('sheet', 14) + ' Edit like Excel</button></div></div>' +
      '<div class="table-scroll"><table class="data"><thead>' + head + '</thead><tbody>' + body + '</tbody>' +
      (rows.length ? '<tfoot>' + foot + '</tfoot>' : '') + '</table></div></div>';
  }

  /* ---- your own sheet columns (not part of the app) ---- */
  function extraCols(k) { return ((S.data.extraCols || {})[k]) || []; }
  function extraVal(r, x) { const v = r._x ? r._x[x.col] : ''; return v === undefined || v === null ? '' : v; }
  function extraCells(k, r) {
    const w = canW(viewMod(k) || TABLE_MOD_C[k] || '');
    return extraCols(k).map(function (x) {
      const v = extraVal(r, x), num = typeof v === 'number';
      return '<td class="xcell' + (num ? ' r num' : ' wrap') + (w ? ' ed' : '') + '"' + (w ? ' data-xe="' + x.col + '" data-xk="' + esc(k) + '" data-id="' + esc(r.id) + '" title="Click to edit"' : '') + '>' +
        (v === '' ? '<span class="muted">—</span>' : esc(num ? num2.format(v) : String(v))) + '</td>';
    }).join('');
  }
  function openExtraEdit(k, id, col) {
    const x = extraCols(k).filter(function (e) { return e.col === col; })[0], r = findRow(k, id);
    if (!x || !r) return;
    const v = extraVal(r, x);
    openModal(x.header, '<form id="xeForm" autocomplete="off"><div class="field full"><label>' + esc(x.header) + ' <span class="muted" style="font-weight:500">· ' + esc(r.name || r.institution || '') + '</span></label>' +
      '<input name="v" value="' + esc(v) + '" maxlength="2000"></div><div class="muted" style="font-size:12px;margin-top:8px">This is one of your own columns in the “' + esc(schema(k).sheet) + '” sheet (column ' + col + '). The app keeps it as it is.</div>' +
      '<div class="form-actions"><button type="button" class="btn ghost" id="xeNo">Cancel</button><button type="submit" class="btn">' + icon('check', 15) + ' Save</button></div></form>', 460);
    $('xeNo').onclick = closeModal;
    $('xeForm').onsubmit = function (e) {
      e.preventDefault();
      let nv = e.target.elements.v.value.trim();
      if (typeof v === 'number' && nv !== '' && isFinite(Number(nv.replace(/[$,\s]/g, '')))) nv = Number(nv.replace(/[$,\s]/g, ''));
      closeModal();
      run(call('updateExtra', k, id, col, nv), 'Saved to the sheet').then(apply);
    };
  }

  function cellHtml(k, c, r) {
    const v = r[c.key];
    const dash = '<span class="muted">—</span>';
    if (c.key === 'owner') return '<td>' + (v ? '<span class="owner">' + avatar(v, 'sm') + esc(v) + '</span>' : dash) + '</td>';
    if (k === 'assets' && c.key === 'name') return '<td><span class="owner" style="cursor:pointer" data-act="history" data-id="' + esc(r.id) + '">' + avatar(v, 'sm') + '<b>' + esc(v) + '</b></span></td>';
    if (schema(k).deal) {
      if (c.key === 'institution') return '<td class="acct">' + esc(v) + (r.source === 'Doctor of Credit' ? ' <span class="tag doc">DoC</span>' : r.source === 'BankRewards' ? ' <span class="tag doc br">BR</span>' : '') + '</td>';
      if (c.key === 'link') return '<td>' + (v ? '<a class="link" href="' + esc(/^https?:/i.test(v) ? v : 'https://' + v) + '" target="_blank" rel="noopener">Open ↗</a>' : dash) + '</td>';
      if (c.key === 'total') return '<td class="r num" style="font-weight:700;color:#15803d">' + money(dealTotal(r)) + '</td>';
      if (c.key === 'applyFor') return '<td>' + (v ? '<span class="owner">' + avatar(v, 'sm') + esc(v) + '</span>' : dash) + '</td>';
    }
    if (k === 'mortgage') {
      if (c.key === 'balance') return '<td class="r num neg">' + money(r.balanceEff) + (r.balanceEstimated ? ' <small class="muted">est.</small>' : '') + '</td>';
      if (c.key === 'monthlyPI') return '<td class="r num">' + money(r.piEff) + (r.monthlyPI == null && r.piEff ? ' <small class="muted">calc</small>' : '') + '</td>';
      if (c.key === 'rate') return '<td class="r num">' + (v == null ? dash : num2.format(v) + '%') + '</td>';
      if (c.key === 'termYears') return '<td class="r num">' + (v == null ? dash : v + ' yrs') + '</td>';
      if (c.key === 'equity') return '<td class="r num pos" style="font-weight:700">' + (r.equity == null ? dash : money(r.equity)) + '</td>';
    }
    if (k === 'turk' && c.key === 'name') return '<td><span class="owner' + (/^(GLD|SLV)$/.test(v) ? ' click" data-pchart="' + (v === 'GLD' ? 'gold' : 'silver') + '" title="Open ' + (v === 'GLD' ? 'gold' : 'silver') + ' price chart' : '') + '">' + symChip(v, true) + '<b>' + esc(v) + '</b>' + (/^(GLD|SLV)$/.test(v) ? icon('chart', 13) : '') + '</span></td>';
    if (k === 'credit' && c.key === 'bonus') {
      if (!(Number(v) > 0)) return '<td class="r num"><span class="muted">—</span></td>';
      return '<td class="r num">' + money(r.bonusRemaining) + (r.redeemedAmt > 0 ? '<small class="muted" style="display:block">of ' + money(v, true) + ' earned</small>' : '') + '</td>';
    }
    if (k === 'credit' && c.key === 'redeemedAmt') {
      if (!(Number(r.redeemedAmt) > 0)) return '<td class="r"><button type="button" class="link-btn" data-act="redeem-hist" data-id="' + esc(r.id) + '"' + (Number(r.bonus) > 0 ? '' : ' hidden') + '>+ record</button></td>';
      return '<td class="r num"><button type="button" class="link-btn strong" data-act="redeem-hist" data-id="' + esc(r.id) + '" title="Redemption history">' + money(r.redeemedAmt) + '</button>' +
        '<small class="muted" style="display:block">' + (r.redeemedLegacy ? 'no record yet' : esc(fmtDate(r.redeemedOn)) + (r.redemptions > 1 ? ' · ' + r.redemptions + ' times' : '')) + '</small></td>';
    }
    switch (c.type) {
      case 'text':
        return c.required ? '<td class="acct">' + esc(v) + '</td>' : '<td class="clip">' + (v ? clipText(v, c.header) : dash) + '</td>';
      case 'email':
        if (c.dependsOn && r[c.dependsOn.key] !== c.dependsOn.value) return '<td>' + dash + '</td>';
        return '<td>' + (v ? esc(v) : dash) + '</td>';
      case 'select':
        if (!c.colors) return '<td>' + (v ? esc(v) : dash) + '</td>';
        return '<td>' + inlineSelect(c, r) + '</td>';
      case 'currency': {
        const neg = v < 0;
        return '<td class="r num' + (neg ? ' neg' : '') + '">' + (v == null ? dash : money(v)) + '</td>';
      }
      case 'number':
        return '<td class="r num">' + (v == null ? dash : num2.format(v)) + '</td>';
      case 'formula':
        if (c.format === 'date') return '<td>' + (v ? esc(fmtDate(v)) : dash) + '</td>';
        return '<td class="r num' + (k === 'assets' && c.key === 'balance' ? '" style="font-weight:700' : '') + '">' +
          (v == null ? '<span class="muted">…</span>' : c.format === 'currency4' ? price4(v) : money(v)) +
          (r._stale ? ' <span class="stale" title="Live price unavailable – using last known">*</span>' : '') + '</td>';
      case 'date': {
        if (!v) return '<td>' + dash + '</td>';
        if (c.pastDue) {
          const d = daysUntil(v);
          if (d < 0) return '<td><span class="date-past" title="Past due">' + esc(fmtDate(v)) + '</span></td>';
          if (d <= 30) return '<td><span class="date-soon" title="' + d + ' days left">' + esc(fmtDate(v)) + '</span></td>';
        }
        return '<td>' + esc(fmtDate(v)) + '</td>';
      }
      case 'history':
        return '<td><button type="button" class="hist-btn" data-act="history" data-id="' + esc(r.id) + '">' + icon('clock', 14) + ' History (' + (v || 0) + ')</button></td>';
      default:
        return '<td>' + esc(v) + '</td>';
    }
  }

  function inlineSelect(c, r) {
    const v = r[c.key] || '', p = colorOf(c, v);
    const style = p ? ' style="background-color:' + p.bg + ';color:' + p.fg + '"' : '';
    return '<select class="pill-select' + (p ? '' : ' none') + '"' + style + ' data-inline="' + c.key + '" data-id="' + esc(r.id) + '">' +
      '<option value="">—</option>' + c.options.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
  }

  /* ======================================================================
   *  MODALS
   * ==================================================================== */
  function openModal(title, html, width) {
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = recolor(html);
    $('modalBack').querySelector('.modal').style.width = width ? 'min(' + width + 'px,100%)' : '';
    $('modalBack').hidden = false;
    const f = $('modalBody').querySelector('input:not([disabled]):not([type=checkbox]),select,textarea');
    if (f) setTimeout(function () { f.focus(); }, 40);
  }
  function closeModal() { $('modalBack').hidden = true; $('modalBody').innerHTML = ''; }

  function confirmBox(msg, okLabel) {
    return new Promise(function (resolve) {
      openModal('Please confirm', '<p style="margin:0 0 4px;font-size:14px;line-height:1.5">' + msg + '</p>' +
        '<div class="form-actions"><button type="button" class="btn ghost" id="cNo">Cancel</button>' +
        '<button type="button" class="btn danger" id="cYes">' + esc(okLabel || 'Delete') + '</button></div>', 460);
      $('cNo').onclick = function () { closeModal(); resolve(false); };
      $('cYes').onclick = function () { closeModal(); resolve(true); };
    });
  }

  function fieldHtml(c, val) {
    const id = 'f_' + c.key;
    const label = '<label for="' + id + '">' + esc(c.header) + (c.required ? ' <span class="req">*</span>' : '') + '</label>';
    const full = (c.type === 'text' && !c.required) ? ' full' : '';
    let input;
    switch (c.type) {
      case 'select': {
        const opts = c.optionsFrom === 'prices'
          ? S.data.prices.map(function (p) { return { v: p.symbol, t: p.symbol + ' — ' + p.name }; })
          : c.options.map(function (o) { return { v: o, t: o }; });
        input = '<select id="' + id + '" name="' + c.key + '"><option value="">— Select —</option>' +
          opts.map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.v === val ? ' selected' : '') + '>' + esc(o.t) + '</option>'; }).join('') + '</select>';
        break;
      }
      case 'currency':
        input = '<div class="money"><span>$</span><input id="' + id + '" name="' + c.key + '" type="number" step="0.01" inputmode="decimal" value="' + (val == null ? '' : esc(val)) + '" placeholder="0.00"></div>';
        break;
      case 'number':
        input = '<input id="' + id + '" name="' + c.key + '" type="number" step="any" inputmode="decimal" value="' + (val == null ? '' : esc(val)) + '" placeholder="0">';
        break;
      case 'date':
        input = '<input id="' + id + '" name="' + c.key + '" type="date" value="' + esc(val || '') + '">';
        break;
      case 'email':
        input = '<input id="' + id + '" name="' + c.key + '" type="email" value="' + esc(val || '') + '" placeholder="name@example.com">' +
          (c.dependsOn ? '<span class="hint">Only when ' + esc(c.dependsOn.value) + ' is selected</span>' : '');
        break;
      default:
        input = '<input id="' + id + '" name="' + c.key + '" type="text" value="' + esc(val || '') + '"' + (c.required ? ' required' : '') + '>';
    }
    return '<div class="field' + full + '">' + label + input + '</div>';
  }

  function openEditor(k, id, preset) {
    const def = schema(k);
    const r = id ? findRow(k, id) : null;
    const defaults = Object.assign({}, preset || {});
    if (!r && S.owner !== 'All' && ownerKey(k)) defaults[ownerKey(k)] = S.owner;
    if (!r && schema(k).deal) { defaults.status = 'Not Applied Yet'; defaults.redeemed = 'No'; defaults.source = 'My Deal'; defaults.cbProvider = 'None'; }
    const editable = def.columns.filter(function (c) { return ['id', 'formula', 'history'].indexOf(c.type) === -1; });
    let extra = '';
    if (k === 'mortgage') extra = '<div class="field full"><span class="hint">Leave <b>Current Balance</b> empty to estimate it from the original amount, rate, term and start date. Leave <b>Monthly P&amp;I</b> empty to calculate it. Home value is used for equity and (when the switch is ON) net worth.</span></div>';
    if (k === 'credit') extra = '<div class="field full"><span class="hint"><b>Bonus planner:</b> fill Bonus Min Spend + Deadline to track progress. Spending comes from Transactions whose account matches the card name, or the name you put in “Account Name in Transactions”.</span></div>';
    if (k === 'assets') extra = '<div class="field full"><span class="hint">One row per person. Given, Received and Balance are calculated from the <b>History</b> (Assets_History sheet). ' +
      (r ? '' : 'After saving, you can add the first entry.') + '</span></div>';
    if (k === 'turk') extra = '<div class="field full"><div class="preview" id="turkPreview"></div></div>';
    if (k === 'stocks') extra = '<div class="field full"><span class="hint" id="stkHint"></span><div class="stk-check"><button type="button" class="btn ghost sm" id="stkCheck">' + icon('search', 14) + ' Check symbol</button><span id="stkQuote"></span></div>' +
      '<span class="hint">Quantity 0 = watchlist. Avg Cost and Manual Price are in the stock’s own currency (₺ for BIST, pence for London). Set <b>Count in Net Worth</b> to Exclude for shares already inside an Investment account balance.</span></div>';
    const html = '<form id="editForm" autocomplete="off"><div class="form-grid">' +
      editable.map(function (c) { return fieldHtml(c, r ? r[c.key] : defaults[c.key]); }).join('') + extra +
      '</div><div class="form-actions">' +
      (r ? '<button type="button" class="btn danger left" id="fDel">' + icon('trash', 15) + ' Delete</button>' : '') +
      '<button type="button" class="btn ghost" id="fCancel">Cancel</button>' +
      '<button type="submit" class="btn">' + (r ? 'Save changes' : 'Add ' + esc(singular(k))) + '</button></div></form>';
    openModal((r ? 'Edit ' : 'New ') + singular(k), html, k === 'assets' ? 520 : null);

    const form = $('editForm');
    editable.forEach(function (c) {
      if (!c.dependsOn) return;
      const src = form.elements[c.dependsOn.key], tgt = form.elements[c.key];
      const sync = function () { const on = src.value === c.dependsOn.value; tgt.disabled = !on; if (!on) tgt.value = ''; };
      src.addEventListener('change', sync); sync();
    });
    if (k === 'turk') {
      const upd = function () {
        const sym = form.elements.name.value, p = priceOf(sym), amt = parseFloat(form.elements.amount.value) || 0;
        $('turkPreview').innerHTML = p
          ? '<span style="display:inline-block;vertical-align:middle;margin-right:8px">' + symChip(sym, true) + '</span>' +
            num2.format(amt) + ' ' + esc(p.unit) + ' × ' + price4(p.price) + ' = <b>' + money(amt * (p.price || 0)) + '</b>'
          : 'Pick an asset: GLD (gold, grams), SLV (silver, grams), DOLLAR (× 1), TL, EUR… Add more in the <b>Prices</b> sheet.';
      };
      form.elements.name.addEventListener('change', upd);
      form.elements.amount.addEventListener('input', upd);
      upd();
    }
    if (k === 'stocks') stockEditorExtras(form);
    $('fCancel').onclick = closeModal;
    if (r) $('fDel').onclick = function () { closeModal(); removeRow(k, r.id); };
    form.onsubmit = function (e) {
      e.preventDefault();
      const rec = { id: r ? r.id : '' };
      editable.forEach(function (c) { rec[c.key] = form.elements[c.key].value; });
      const req = editable.filter(function (c) { return c.required && !String(rec[c.key]).trim(); })[0];
      if (req) { toast(req.header + ' is required', 'err'); return; }
      if (k === 'assets') {
        const dup = S.data.tables.assets.filter(function (x) { return x.id !== rec.id && norm(x.name) === norm(rec.name); })[0];
        if (dup) {
          toast('"' + dup.name + '" already exists — opening their history', 'err');
          closeModal(); openHistory(dup.id); return;
        }
      }
      const toYes = k === 'credit' && rec.bonusRedeemed === 'Yes' && (!r || r.bonusRedeemed !== 'Yes');
      run(call('saveRecord', k, rec), r ? 'Saved' : 'Added').then(function (p) {
        closeModal(); apply(p);
        if (toYes) {
          const card = r ? findRow('credit', r.id) : S.data.tables.credit.filter(function (x) { return norm(x.name) === norm(rec.name); })[0];
          if (card) openRedeem(card.id, { markYes: true });
        }
        if (k === 'assets' && !r) {
          const created = S.data.tables.assets.filter(function (x) { return norm(x.name) === norm(rec.name); })[0];
          if (created) openHistory(created.id);
        }
      });
    };
  }

  function removeRow(k, id) {
    const r = findRow(k, id);
    if (!r) return;
    const extra = k === 'assets' ? ' All of their <b>' + (r.history || 0) + ' history entries</b> will be deleted too.' : '';
    confirmBox('Delete <b>' + esc(k === 'stocks' ? r.symbol : (r.name || r.institution || r.category || r.description || 'this row')) + '</b>? This removes the row from the spreadsheet.' + extra).then(function (ok) {
      if (ok) run(call('deleteRecord', k, id), 'Deleted').then(apply);
    });
  }

  /* ---------- Assets history ---------- */
  const HS = { id: null, editId: null, dir: 'out' };

  function openHistory(id) {
    HS.id = id; HS.editId = null; HS.dir = 'out';
    const r = findRow('assets', id);
    if (!r) return;
    openModal('History', '', 780);
    renderHistory();
  }

  function renderHistory() {
    const r = findRow('assets', HS.id);
    if (!r || $('modalBack').hidden) return;
    const entries = historyFor(r.name);
    // running balance (oldest → newest)
    const asc = entries.slice().reverse();
    let run_ = 0; const bal = {};
    asc.forEach(function (e) { run_ += e.amount; bal[e.id] = run_; });
    const ed = HS.editId ? entries.filter(function (e) { return e.id === HS.editId; })[0] : null;
    if (ed) HS.dir = ed.amount < 0 ? 'in' : 'out';

    $('modalTitle').textContent = 'History';
    $('modalBody').innerHTML =
      '<div class="h-head">' + avatar(r.name, 'lg') + '<div class="nm">' + esc(r.name) + '<small>' + (r.notes ? esc(r.notes) + ' · ' : '') +
        (r.whenGiven ? 'since ' + fmtDate(r.whenGiven) : 'no entries yet') + '</small></div>' +
        '<div class="bal"><small>Balance owed to us</small><b class="num' + (r.balance < 0 ? ' neg' : '') + '">' + money(r.balance) + '</b></div></div>' +
      '<div class="h-stats"><div>Given (+)<b class="num">' + money(r.given) + '</b></div><div>Received back (−)<b class="num pos">' + money(r.received) + '</b></div>' +
        '<div>Entries<b>' + entries.length + '</b></div></div>' +
      '<form class="h-add" id="histForm" autocomplete="off"><div class="form-grid">' +
        '<div class="field"><label>Type</label><div class="seg"><button type="button" class="out' + (HS.dir === 'out' ? ' on' : '') + '" data-dir="out">' + icon('out', 14, 2.5) + ' Given</button>' +
          '<button type="button" class="in' + (HS.dir === 'in' ? ' on' : '') + '" data-dir="in">' + icon('in', 14, 2.5) + ' Received</button></div></div>' +
        '<div class="field"><label for="hAmt">Amount ($)</label><input id="hAmt" type="number" min="0" step="0.01" placeholder="0.00" value="' + (ed ? Math.abs(ed.amount) : '') + '" required></div>' +
        '<div class="field"><label for="hDate">Date</label><input id="hDate" type="date" value="' + esc(ed ? ed.date : S.data.meta.today) + '" required></div>' +
        '<div class="field"><label for="hCom">Comment</label><input id="hCom" type="text" placeholder="e.g. Paid back via Zelle" value="' + esc(ed ? ed.comment : '') + '"></div>' +
      '</div><div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap">' +
        '<span class="hint" style="font-size:11.5px;color:var(--muted)">Tip: you can also type rows straight into the ' +
          '<a class="link" href="' + esc(S.data.meta.historySheetUrl) + '" target="_blank" rel="noopener">Assets_History sheet</a> — use the same name.</span>' +
        '<div class="spacer"></div>' +
        (ed ? '<button type="button" class="btn ghost sm" id="hCancel">Cancel edit</button>' : '') +
        '<button type="submit" class="btn sm ' + (HS.dir === 'out' ? 'orange' : '') + '" id="hSubmit">' + icon(ed ? 'check' : 'plus', 14) + (ed ? ' Save entry' : ' Add entry') + '</button>' +
      '</div></form>' +
      (entries.length ? '<ul class="timeline">' + entries.map(function (e) {
        const out = e.amount > 0;
        return '<li class="' + (e.id === HS.editId ? 'editing' : '') + '"><span class="arrow-ic ' + (out ? 'out' : 'in') + '">' + icon(out ? 'out' : 'in', 17, 2.5) + '</span>' +
          '<div class="t"><b>' + esc(e.comment || (out ? 'Money given' : 'Money received')) + '</b><small>' + fmtDate(e.date) + ' · <span class="tag ' + (out ? 'out' : 'in') + '">' + (out ? 'Given' : 'Received') + '</span></small></div>' +
          '<div class="a num"><span class="' + (out ? '' : 'pos') + '">' + (out ? '+' : '−') + money(Math.abs(e.amount)) + '</span><small>balance ' + money(bal[e.id]) + '</small></div>' +
          '<button type="button" class="icon-btn" title="Edit" data-hedit="' + esc(e.id) + '">' + icon('edit', 15) + '</button>' +
          '<button type="button" class="icon-btn del" title="Delete" data-hdel="' + esc(e.id) + '">' + icon('trash', 15) + '</button></li>';
      }).join('') + '</ul>' : '<div class="empty">No history yet — add the first entry above.</div>');

    const form = $('histForm');
    form.querySelectorAll('[data-dir]').forEach(function (b) {
      b.onclick = function () {
        HS.dir = b.getAttribute('data-dir');
        form.querySelectorAll('[data-dir]').forEach(function (x) { x.classList.toggle('on', x === b); });
        $('hSubmit').classList.toggle('orange', HS.dir === 'out');
      };
    });
    if ($('hCancel')) $('hCancel').onclick = function () { HS.editId = null; renderHistory(); };
    form.onsubmit = function (ev) {
      ev.preventDefault();
      const amt = Math.abs(parseFloat($('hAmt').value));
      if (!isFinite(amt) || amt === 0) { toast('Enter an amount', 'err'); return; }
      const entry = { id: HS.editId || '', date: $('hDate').value, amount: HS.dir === 'out' ? amt : -amt, comment: $('hCom').value };
      run(call('saveHistory', HS.id, entry), HS.editId ? 'Entry updated' : 'Entry added').then(function (p) {
        S.data = p; HS.editId = null; render(); renderHistory();
      });
    };
    $('modalBody').querySelectorAll('[data-hedit]').forEach(function (b) {

      const act = t.getAttribute('data-act'), id = t.getAttribute('data-id'), cat = t.getAttribute('data-cat');

  document.addEventListener('keydown', function (e) {

  document.addEventListener('change', function (e) {

    if (s.matches && s.matches('select[data-txf]')) { S.txF[s.getAttribute('data-txf')] = s.value; S.txLimit = 150; render(); return; }

    if (s.id === 'fcEvery') { S.fcEveryday = s.checked; render(); return; }
    if (s.id === 'fcMin') { S.fcThreshold = Math.max(0, Number(s.value) || 0); savePref('fcMin', S.fcThreshold); render(); return; }
    if (s.id === 'emToggle') {
      if (s.checked && !$('emTo').value.trim()) { toast('Enter a recipient e-mail first', 'err'); s.checked = false; return; }

  function init() {

      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (!/^atlas/.test(th0)) { th0 = prefersDark ? 'atlasdark' : 'atlas'; savePref('theme', th0); call('setConfig', { theme: th0 }).catch(function () {}); S._dsNew = true; }
      savePref('ds5', '1');

    if (loadPref('fcMin') !== null) S.fcThreshold = Number(loadPref('fcMin')) || 0;
    $('privBtn').onclick = function () { S.privacy = !S.privacy; savePref('privacy', S.privacy ? '1' : '0'); renderTopControls(); };

    });
    document.addEventListener('click', function (e) { document.querySelectorAll('details.nav-dd[open]').forEach(function (d) { if (!d.contains(e.target)) d.open = false; }); });
    // mortgage simulator (live, no re-render)
    document.addEventListener('input', function (e) {
      const box = e.target.closest && e.target.closest('[data-sim]');
      if (!box) return;
      if (e.target.classList.contains('sim-r')) box.querySelector('.sim-n').value = e.target.value;

    render();

  try { init(); } catch (err) {
    console.error(err);
    try { render(); } catch (e2) { console.error(e2); }
    $('view').insertAdjacentHTML('afterbegin', '<div class="banner bad">' + icon('alert', 16) + '<span><b>Something went wrong while starting the app:</b> ' + esc((err && err.message) || String(err)) +
      '. Make sure Index.html, Styles.html, App.html and Code.gs are all from the same version, then deploy a New version.</span></div>');
  }
};

(function () {

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function setToken(t) {
    token = t; try { sessionStorage.setItem(KEY, t); } catch (e) { /* ignore */ }
    clearTimeout(refreshT);
    var ms = exp(t) - Date.now() - 5 * 60000;   // ask Google for a fresh token 5 min before expiry
    if (ms > 0) refreshT = setTimeout(function () { try { google.accounts.id.prompt(); } catch (e) { /* ignore */ } }, ms);
  }
  function post(fn, args) {
    return fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [], token: token }) })
      .then(function (r) { if (!r.ok) throw new Error('Server error ' + r.status); return r.json(); });
  }

    return post(fn, args).then(function (j) {
      if (j.ok) return j.result;
      if (j.code === 'AUTH' && !retried) { token = null; return needLogin(j.error).then(function () { return apiCall(fn, args, true); }); }
      if (j.code === 'DENIED') showLogin(j.error, true);

    });

  window.WM_API = {
    call: apiCall,
    signOut: function () {
      try { sessionStorage.removeItem(KEY); google.accounts.id.disableAutoSelect(); } catch (e) { /* ignore */ }
      location.reload();
    }
  };
  var box = document.createElement('div');
  box.id = 'login'; box.className = 'login';
  box.innerHTML = '<div class="login-card"><div class="brand-mark">WM</div><h1>Finance</h1><p class="sub">Wealth Management</p>' +
    '<div id="loginMsg" class="login-msg"></div><div id="gBtn"></div><button type="button" id="loginOther" class="btn ghost sm" hidden>Use another Google account</button>' +
    '<p class="fine">Only people the owner has added can sign in. Your Google password never reaches this app.</p></div>';
  document.body.appendChild(box);
  function showLogin(msg, denied) {
    box.hidden = false;
    document.getElementById('loginMsg').innerHTML = msg ? esc(msg) : '';
    document.getElementById('loginMsg').className = 'login-msg' + (denied ? ' bad' : '');
    document.getElementById('loginOther').hidden = !denied;
    renderBtn();
  }
  function renderBtn() {
    if (!window.google || !google.accounts || !google.accounts.id) return;
    document.getElementById('gBtn').innerHTML = '';
    google.accounts.id.renderButton(document.getElementById('gBtn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 260 });
  }
  function onCredential(resp) {
    setToken(resp.credential);
    document.getElementById('loginMsg').textContent = 'Signing in…';
    if (!started) start();
    else { box.hidden = true; var w = waiting; waiting = []; w.forEach(function (f) { f(); }); }
  }
  function start() {
    post('getAllData').then(function (j) {
      if (!j.ok) {
        if (j.code === 'AUTH') { token = null; showLogin(j.error); }
        else showLogin(j.error, j.code === 'DENIED');
        return;
      }
      started = true; box.hidden = true;
      window.WM_APP(j.result);
    }).catch(function (e) { showLogin('Could not reach the server: ' + e.message); });
  }
  function boot() {
    if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(boot, 150); return; }
    google.accounts.id.initialize({ client_id: CFG.googleClientId, callback: onCredential, auto_select: true, cancel_on_tap_outside: false, itp_support: true });
    document.getElementById('loginOther').onclick = function () { try { sessionStorage.removeItem(KEY); google.accounts.id.disableAutoSelect(); } catch (e) { /* ignore */ } token = null; showLogin(''); google.accounts.id.prompt(); };
    if (valid(token)) { setToken(token); document.getElementById('loginMsg').textContent = 'Signing in…'; start(); }
    else { showLogin(''); google.accounts.id.prompt(); }
  }
  boot();
})();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
