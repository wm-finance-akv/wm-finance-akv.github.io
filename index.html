<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#5b4ce0">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WM Finance">
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --violet:#5b4ce0; --violet-d:#4232c7; --violet-l:#efedff; --violet-2:#7c6cff;
  --orange:#ff7a45; --orange-l:#fff1ea; --yellow:#ffb81c; --yellow-l:#fff7e0;
  --pink:#f43f6b; --pink-l:#ffe8ee; --green:#16a34a; --green-l:#e6f8ee; --teal:#14b8a6; --sky:#38bdf8;
  --silver:#94a3b8; --gold:#e0a100;
  --bg:#f4f5fb; --card:#ffffff; --ink:#1e1b4b; --ink-2:#3f3d56; --muted:#8a8aa3; --line:#ecebf5;
  --tint:#faf9ff; --tint2:#f3f2f8; --line2:#e6e4f2; --font:Poppins;
  --side-bg:linear-gradient(180deg,#5b4ce0 0%,#4232c7 100%); --side-ink:#fff; --side-ink2:#e4e0ff; --side-hover:rgba(255,255,255,.1); --side-hover2:rgba(255,255,255,.18);
  --radius:20px; --shadow:0 4px 24px rgba(40,30,120,.06); --shadow-lg:0 22px 50px rgba(40,30,120,.18);
  --sidebar:280px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font),Poppins,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* ============ Layout ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;padding:26px 0 20px 18px;position:sticky;top:0;height:100vh;z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.sidebar .sidebar-foot{margin-top:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 18px 30px 6px}
.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 8px 18px rgba(255,122,69,.45)}
.brand-text{font-weight:700;font-size:19px;letter-spacing:-.3px}
.brand-text small{display:block;font-weight:500;font-size:11px;opacity:.7;letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.nav-item{position:relative;display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:30px 0 0 30px;color:var(--side-ink2);text-decoration:none;background:none;border:0;width:100%;text-align:left;font-weight:500;transition:background .15s,color .15s}
.nav-item:hover{background:var(--side-hover);color:var(--side-ink)}
.nav-item.active{background:var(--bg);color:var(--violet);font-weight:700}
.nav-item.active::before,.nav-item.active::after{content:"";position:absolute;right:0;width:24px;height:24px;background:transparent;pointer-events:none}
.nav-item.active::before{top:-24px;border-bottom-right-radius:24px;box-shadow:8px 8px 0 8px var(--bg)}
.nav-item.active::after{bottom:-24px;border-top-right-radius:24px;box-shadow:8px -8px 0 8px var(--bg)}
.nav-item .ico{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.nav-item .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.nav .nav-item{padding-left:14px;padding-right:12px;gap:12px}
.nav-item .count{margin-left:auto;margin-right:6px;font-size:11px;font-weight:700;background:var(--side-hover2);padding:2px 9px;border-radius:99px}
.nav-item.active .count{background:var(--violet-l);color:var(--violet)}
.sidebar-foot{padding:14px 18px 0 0;display:flex;flex-direction:column;gap:4px}
.side-card{margin:0 18px 12px 0;background:rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;font-size:12px;line-height:1.45}
.side-card b{display:block;font-size:13px;margin-bottom:4px}
.side-card a{color:#fff;font-weight:700}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:24px 34px 6px}
.titles{flex:1;min-width:0}
.hello{color:var(--muted);font-size:13px;font-weight:500}
.topbar h1{margin:2px 0 0;font-size:27px;font-weight:700;color:var(--ink);letter-spacing:-.6px}
.top-actions{display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:99px;padding:10px 16px;width:270px;color:var(--muted);box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:none;width:100%}
.round-btn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow)}
.round-btn:hover{color:var(--violet)}
.round-btn .dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;padding:5px 14px 5px 5px;box-shadow:var(--shadow)}
.user-chip .who{font-size:12px;line-height:1.2}
.user-chip .who b{display:block;font-size:13px}
.user-chip .who span{color:var(--muted);max-width:170px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 34px 0}
.view{padding:16px 34px 34px}
.foot{padding:0 34px 26px;color:var(--muted);font-size:12px}

/* ============ Buttons & chips ============ */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:600;background:var(--violet);color:#fff;box-shadow:0 10px 20px rgba(91,76,224,.28);transition:transform .08s,background .15s}
.btn:hover{background:var(--violet-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:var(--card);color:var(--pink);border:1px solid #ffd0db;box-shadow:none}
.btn.danger:hover{background:var(--pink-l)}
.btn.orange{background:var(--orange);box-shadow:0 10px 20px rgba(255,122,69,.3)}
.btn.orange:hover{background:#f0632b}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:11px}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--violet-l);color:var(--violet)}
.icon-btn.del:hover{background:var(--pink-l);color:var(--pink)}
.chips{display:inline-flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--shadow)}
.chip{border:0;background:none;padding:7px 14px;border-radius:10px;font-weight:600;color:var(--muted);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip.active{background:var(--violet);color:#fff}
.chips.light .chip.active{background:var(--violet-l);color:var(--violet)}
.spacer{flex:1}
.link{color:var(--violet);font-weight:600;text-decoration:none;font-size:12px}
.link:hover{text-decoration:underline}

/* ============ Cards ============ */
.grid{display:grid;gap:20px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;min-width:0}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.card-h h3{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.card-h .sub{color:var(--muted);font-size:12px;font-weight:500}
.card-h .right{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px}

/* KPI */
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kpi .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 54px}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .val{font-size:23px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.kpi .delta{font-size:11.5px;color:var(--muted)}
.up{color:var(--green);font-weight:700}
.down{color:var(--pink);font-weight:700}
.i-violet{background:var(--violet)} .i-orange{background:var(--orange)} .i-yellow{background:var(--yellow)} .i-pink{background:var(--pink)} .i-teal{background:var(--teal)} .i-gold{background:linear-gradient(135deg,#f5c542,#d49b00)}

.hero-row{grid-template-columns:1.35fr 1fr 1fr}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,var(--violet-2) 0%,var(--violet) 45%,var(--violet-d) 100%);color:#fff;grid-row:span 2;display:flex;flex-direction:column}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{font-size:13px;opacity:.85;font-weight:500;display:flex;align-items:center;gap:8px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-1px;margin:6px 0 4px}
.hero .delta-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600}
.hero .spark{margin:14px -6px 6px;flex:1;min-height:70px}
.hero .split{display:flex;gap:10px;margin-top:auto}
.hero .split div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;font-size:11.5px;opacity:.95}
.hero .split b{display:block;font-size:16px;margin-top:2px}
.hero .formula{font-size:11px;opacity:.7;margin-top:12px}

/* Analytics */
.analytics-row{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.chart{position:relative;height:280px}
.chart svg{overflow:visible}
.chart .tip{position:absolute;pointer-events:none;transform:translate(-50%,-100%);background:var(--violet);color:#fff;border-radius:12px;padding:8px 12px;font-size:12px;white-space:nowrap;box-shadow:0 10px 24px rgba(91,76,224,.35);margin-top:-14px;transition:left .05s,top .05s}
.chart .tip::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--violet);border-bottom:0}
.chart .tip b{display:block;font-size:14px}
.chart .tip span{opacity:.8}
.legend-inline{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend-inline i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.legend-inline b{color:var(--ink);margin-left:4px}
.chart-empty{height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:8px;background:repeating-linear-gradient(0deg,transparent 0 55px,var(--tint2) 55px 56px)}
.chart-empty b{color:var(--ink);font-size:22px}

/* Credit card visuals */
.cc{position:relative;border-radius:20px;padding:18px 20px;color:#fff;overflow:hidden;min-height:170px;display:flex;flex-direction:column;box-shadow:0 16px 30px rgba(40,30,120,.2);cursor:pointer}
.cc::before{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12)}
.cc::after{content:"";position:absolute;right:30px;bottom:-80px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc .top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.cc .chip-ic{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#ffe38a,#d9a520);opacity:.95}
.cc .bank{font-weight:700;font-size:14px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .bal{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:auto;position:relative;z-index:1}
.cc .bal small{display:block;font-size:11px;font-weight:500;opacity:.8;letter-spacing:.3px}
.cc .bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;margin-top:10px;position:relative;z-index:1;opacity:.95}
.cc .bottom b{display:block;font-size:12.5px}
.cc .st{background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px;font-weight:700;font-size:11px}
.g0{background:linear-gradient(135deg,#6d5dfc,#b44cff)} .g1{background:linear-gradient(135deg,#ff7a45,#ff4f8b)} .g2{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.g3{background:linear-gradient(135deg,#1f1b4d,#4b3fa8)} .g4{background:linear-gradient(135deg,#14b8a6,#0ea5e9)} .g5{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.cc-list{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.cc-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.cc-row:hover{background:var(--tint)}
.cc-row.sel{background:var(--violet-l)}
.cc-row .sw{width:28px;height:18px;border-radius:5px;flex:0 0 28px}
.cc-row .n{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-row .v{font-weight:700;font-size:13px}
.cards-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:20px}

/* Lists */
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer;border-radius:12px;padding-left:8px;padding-right:8px}
.li.click:hover{background:var(--tint)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-weight:700;font-size:13.5px;text-align:right;white-space:nowrap}
.li .amt small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 40px;font-size:14px}
.av.sm{width:28px;height:28px;flex-basis:28px;font-size:11px}
.av.lg{width:58px;height:58px;flex-basis:58px;font-size:20px}
.arrow-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 38px}
.arrow-ic.out{background:var(--orange-l);color:var(--orange)}
.arrow-ic.in{background:var(--green-l);color:var(--green)}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:600;font-size:11px}
.tag.out{background:var(--orange-l);color:#c2410c}
.tag.in{background:var(--green-l);color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}

.cat{margin-bottom:16px}
.cat:last-child{margin-bottom:0}
.cat .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.cat .row b{font-size:13.5px;font-weight:600}
.cat .row span{font-weight:700;font-size:13.5px}
.cat .row small{color:var(--muted);font-size:11.5px;display:block;font-weight:500}
.bar{height:9px;border-radius:99px;background:var(--tint2);overflow:hidden;display:flex}
.bar span{display:block;height:100%;border-radius:99px}

.alerts{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.alert{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;font-size:13px;cursor:pointer;background:var(--tint)}
.alert:hover{filter:brightness(.98)}
.alert .ai{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 34px}
.alert small{display:block;color:var(--muted);margin-top:1px;font-size:11.5px}

.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.px{border-radius:16px;padding:14px;background:var(--tint);border:1px solid var(--line)}
.px .s{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.px .p{font-size:19px;font-weight:700;margin-top:8px;letter-spacing:-.3px}
.px .u{font-size:11px;color:var(--muted)}
.sym{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:10px;font-weight:800;font-size:11px;color:#fff}
.sym.sm{min-width:26px;height:26px;border-radius:8px;font-size:10px}
.stale{font-size:11px;color:var(--orange);font-weight:600}

/* ============ Tables ============ */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.tile{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.tile .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 46px}
.tile .l{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.4px}
.table-card{padding:0;overflow:hidden}
.table-card .card-h{padding:18px 22px 0}
.table-scroll{overflow:auto;max-height:calc(100vh - 300px)}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.data th{position:sticky;top:0;z-index:2;background:var(--card);color:var(--muted);text-align:left;font-weight:600;font-size:12px;padding:14px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.data th.nosort{cursor:default}
table.data th .arrow{color:var(--violet);margin-left:4px}
table.data td{padding:11px 14px;border-bottom:1px solid var(--tint2);vertical-align:middle;white-space:nowrap}
table.data td.wrap{white-space:normal;min-width:160px;max-width:280px;color:var(--ink-2)}
table.data tbody tr:hover td{background:var(--tint)}
table.data td.r,table.data th.r{text-align:right}
table.data tfoot td{position:sticky;bottom:0;background:var(--violet-l);font-weight:700;color:var(--violet-d);border-top:1px solid var(--line2);border-bottom:0}
.acct{font-weight:600;color:var(--ink)}
.owner{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.muted{color:var(--muted)}
.neg{color:var(--pink)}
.pos{color:var(--green)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}

.pill{display:inline-block;padding:5px 11px;border-radius:99px;font-weight:600;font-size:12px}
select.pill-select{appearance:none;-webkit-appearance:none;border:0;border-radius:99px;padding:6px 28px 6px 12px;font-weight:600;font-size:12px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 10px) 55%;background-size:4px 4px;background-repeat:no-repeat;outline:none}
select.pill-select.none{background-color:var(--tint2);color:var(--muted)}
.date-past{background:var(--pink-l);color:#be123c;font-weight:600;padding:5px 11px;border-radius:99px}
.date-soon{background:var(--orange-l);color:#c2410c;font-weight:600;padding:5px 11px;border-radius:99px}
.hist-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--violet-l);color:var(--violet);border-radius:99px;padding:6px 13px;font-weight:600;font-size:12px}
.hist-btn:hover{background:var(--line2)}

/* Cashback tile + popover */
.cash-wrap{position:relative;display:inline-block;margin-bottom:16px;z-index:20}
.tile.cash{border:0;cursor:pointer;text-align:left;min-width:320px;color:#fff;background:linear-gradient(120deg,#ff8a4c 0%,#ff5f8f 100%);box-shadow:0 14px 28px rgba(255,95,143,.3);transition:transform .12s}
.tile.cash:hover{transform:translateY(-2px)}
.tile.cash .ic{background:rgba(255,255,255,.22)}
.tile.cash .l{color:rgba(255,255,255,.85)}
.tile.cash .v{font-size:24px}
.tile.cash .s{font-size:11.5px;opacity:.85;margin-top:2px}

/* People cards (Assets page) */

.person{cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:12px}

/* ============ Modal / forms ============ */
.modal-back{position:fixed;inset:0;background:rgba(30,27,75,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}

.modal-head{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:18px;color:var(--ink);flex:1}
.modal-body{padding:22px 24px;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field label .req{color:var(--pink)}
.field input,.field select,.field textarea{border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;background:var(--card);outline:none;transition:border .15s,box-shadow .15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet-2);box-shadow:0 0 0 4px rgba(124,108,255,.15)}
.field input:disabled{background:var(--tint);color:#b3b1c7}

.preview{background:var(--violet-l);color:var(--violet-d);border-radius:14px;padding:12px 14px;font-size:13px}

.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

.h-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.h-head .nm{font-size:20px;font-weight:700}

.h-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.h-stats div{background:var(--tint);border-radius:14px;padding:12px 14px;font-size:11.5px;color:var(--muted)}

.h-add{background:var(--tint);border:1.5px dashed var(--line2);border-radius:18px;padding:16px;margin-bottom:18px}
.h-add .form-grid{grid-template-columns:minmax(210px,auto) 130px 160px minmax(0,1fr)}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:3px;gap:3px;height:44px}
.seg button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;border-radius:9px;padding:0 12px;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}

.seg button.on.in{background:var(--green);color:#fff}
.timeline{list-style:none;margin:0;padding:0}

.timeline li:last-child{border-bottom:0}

.timeline li.editing{background:var(--violet-l);border-radius:12px;padding-left:8px;padding-right:8px}

/* ============ Loading / toast ============ */
.loading{position:fixed;inset:0;background:rgba(244,245,251,.5);display:grid;place-items:center;z-index:200}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line2);border-top-color:var(--violet);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Modular dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;grid-auto-flow:row dense}
.mod{min-width:0;display:flex;flex-direction:column;position:relative}
.mod>.card{flex:1}
.mod>.card:not(.kpi):not(.hero){display:flex;flex-direction:column}
.mod .hero{grid-row:auto;min-height:100%}
.mod.tall .chart{flex:1;height:auto;min-height:280px}
.wS{grid-column:span 3}.wM{grid-column:span 4}.wL{grid-column:span 6}.wXL{grid-column:span 8}.wF{grid-column:1/-1}
.mod.tall{grid-row:span 2}
.dash.editing{row-gap:36px;padding-top:14px}
.dash.editing .mod{outline:2px dashed var(--line2);outline-offset:5px;border-radius:var(--radius);cursor:grab}
.dash.editing .mod>:not(.mod-bar){pointer-events:none;user-select:none}
.mod.dragging{opacity:.35}
.mod.drop-before{box-shadow:-9px 0 0 -3px var(--violet)}
.mod.drop-after{box-shadow:9px 0 0 -3px var(--violet)}
.mod-bar{position:absolute;top:-16px;left:10px;right:10px;z-index:6;display:flex;align-items:center;gap:4px;background:#111827;color:#fff;border-radius:10px;padding:4px 6px;font-size:12px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.mod-bar .grip{display:grid;place-items:center;opacity:.8;cursor:grab}
.mod-bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding-left:2px}
.mod-bar button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;height:24px;min-width:26px;padding:0 6px;font-size:11px;font-weight:700;display:grid;place-items:center}
.mod-bar button:hover,.mod-bar button.on{background:var(--violet)}
.mod-tray{margin-top:24px;background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.chip-add{display:inline-flex;gap:6px;align-items:center;border:1px dashed var(--line2);background:var(--tint);border-radius:99px;padding:7px 12px;margin:0 8px 8px 0;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip-add:hover{border-color:var(--violet);color:var(--violet)}
.dash-help{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pos-c small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.pos-c b{display:block;font-size:26px;font-weight:700;margin:4px 0;letter-spacing:-.5px}
.pos-c em{font-style:normal;font-size:11.5px;color:var(--muted)}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn-leg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px}
.dn-leg div{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.dn-leg i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.dn-leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
@media (max-width:1320px){.wS,.wM{grid-column:span 6}.wXL{grid-column:1/-1}}
@media (max-width:900px){.dash .mod{grid-column:1/-1}.mod.tall{grid-row:auto}.pos{grid-template-columns:1fr}}

/* picker additions */
.tp.top{flex-direction:column}
.tp .tb{height:16%;flex:0 0 16%}
.tp .sb.rail{width:10%}
.shell-opts{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px}
.shell-opts b{display:block;font-size:12.5px;margin-bottom:6px}

/* ---------- Stocks & Crypto ---------- */
.i-purple{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.tile-s{font-size:11.5px;margin-top:1px}
.stk-badge{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 6px;border-radius:9px;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.2px;flex:0 0 auto}
.stk-name{display:flex;align-items:center;gap:10px;min-width:170px}
.stk-name b{display:block;font-size:13px}
.stk-name b small{display:inline;font-size:10.5px;margin-left:4px}
.stk-name>div>small{display:block;color:var(--muted);font-size:11.5px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.data.stk td{white-space:nowrap}
.mkt-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--tint2);margin-bottom:16px}
.mkt-bar span{display:block;height:100%}
.mkt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mkt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--tint);border-radius:14px;padding:12px 14px;text-align:left;min-width:0}
.mkt:hover{border-color:var(--violet)}
.mkt i{width:10px;height:34px;border-radius:5px;flex:0 0 10px}
.mkt>div{min-width:0}
.mkt b{display:block;font-size:13px}
.mkt small{display:block;color:var(--muted);font-size:11.5px}
.mkt .r{margin-left:auto;text-align:right}
.watch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.watch{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-width:0}
.watch:hover{border-color:var(--violet);background:var(--tint)}
.watch .t{min-width:0;flex:1}
.watch .t b{display:block;font-size:13px}
.watch .t small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch .r{text-align:right;font-size:11.5px}
.watch .r b{display:block;font-size:13.5px}
.stk-note{margin-top:14px;color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.stk-check{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 10px;font-size:12.5px}
.stk-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stk-sum>div{background:var(--tint);border-radius:12px;padding:10px 12px}
.stk-sum small{display:block;color:var(--muted);font-size:11px}
.stk-sum b{display:block;font-size:16px}
@media (max-width:1100px){.mkt-grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.mkt-grid,.stk-sum{grid-template-columns:1fr}}

/* ---------- Balance history chart (per page) ---------- */
.hist-card{margin-bottom:20px}
.hist-card .chart{height:260px}
.h-custom{display:flex;gap:12px;flex-wrap:wrap;margin:-4px 0 14px}
.h-custom label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.h-custom input{border:1px solid var(--line2);border-radius:10px;padding:7px 10px;background:var(--card);color:var(--ink)}
.hs-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.hs-row>div{background:var(--tint);border-radius:12px;padding:10px 12px;min-width:0}
.hs-row small{display:block;color:var(--muted);font-size:11px}
.hs-row b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip-parts{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.25);font-size:11.5px}
.tip-parts div{display:flex;justify-content:space-between;gap:14px}
.tip-parts span{max-width:150px;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.tip-parts em{font-style:normal;font-weight:700}
body.dark .h-custom input{background:var(--tint)}
@media (max-width:900px){.hs-row{grid-template-columns:1fr 1fr}}

/* ---------- CFO Executive template (Power BI-style) ---------- */
body[data-theme="cfo"]{--violet:#1f4e8c;--violet-d:#173c6c;--violet-l:#e6eef8;--violet-2:#3a6db0;--orange:#19a7a0;--orange-l:#e2f5f4;--yellow:#f2b134;--teal:#4fb3d9;--pink:#e15759;
  --bg:#eef1f6;--ink:#14213d;--ink-2:#36435e;--muted:#738099;--line:#dfe4ec;--line2:#d0d7e2;--tint:#f6f8fb;--tint2:#edf1f6;--font:"Open Sans";--radius:6px;
  --side-bg:#0f1e3d;--side-ink:#fff;--side-ink2:#aab7d0;--side-hover:rgba(255,255,255,.08);--side-hover2:rgba(255,255,255,.14);--shadow:0 1px 2px rgba(20,33,61,.06);--shadow-lg:0 12px 30px rgba(20,33,61,.18)}
body[data-theme="cfo"] .card{border:1px solid var(--line)}
body[data-theme="cfo"] .card-h h3{text-transform:uppercase;font-size:12.5px;letter-spacing:.6px}
body[data-theme="cfo"] .topbar h1{font-size:22px}
body[data-theme="cfo"] .hero{background:linear-gradient(135deg,#0f1e3d,#1f4e8c)}
body[data-theme="cfo"] .kpi .ic{border-radius:8px}
/* ---------- CFO View page ---------- */
.cfo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.cfo-tabs{display:flex;gap:2px;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);overflow-x:auto;flex:1;min-width:0}
.cfo-tabs button{border:0;background:none;padding:9px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.cfo-tabs button.on{background:var(--violet);color:#fff}
.cfo-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.cfo-mod .cfo-kpis{gap:10px}
.cfo-kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 14px 18px;position:relative;overflow:hidden;min-width:0;border:1px solid var(--line)}
.cfo-mod .cfo-kpi{box-shadow:none;background:var(--tint)}
.cfo-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
.cfo-kpi:nth-child(2)::before{background:var(--orange)}.cfo-kpi:nth-child(3)::before{background:var(--teal)}.cfo-kpi:nth-child(4)::before{background:var(--yellow)}.cfo-kpi:nth-child(5)::before{background:var(--pink)}
.cfo-kpi.click{cursor:pointer}.cfo-kpi.click:hover{border-color:var(--violet)}
.cfo-kpi.on{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet-l)}
.cfo-kpi small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.cfo-kpi b{display:block;font-size:22px;font-weight:700;margin:4px 0 2px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfo-kpi em{font-style:normal;font-size:11.5px;color:var(--muted)}
table.xl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.xl th{background:var(--tint2);color:var(--ink-2);font-weight:700;font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:left;position:sticky;top:0}
table.xl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.xl td.r,table.xl th.r{text-align:right}
table.xl .sticky{position:sticky;left:0;background:var(--card);z-index:1;min-width:210px;font-weight:600}
table.xl th.sticky{background:var(--tint2);z-index:3}
table.xl .tot{background:var(--tint);font-weight:700}
table.xl tr.sub td{font-weight:700;background:var(--tint)}
table.xl tr.sub td.sticky{background:var(--tint)}
table.xl tr.total td{font-weight:800;border-top:2px solid var(--ink-2);background:var(--violet-l)}
table.xl tr.total td.sticky{background:var(--violet-l)}
table.xl tr.pct td{font-style:italic;color:var(--muted);font-size:11.5px}
table.xl tr.a80 td{background:rgba(91,76,224,.04)}
.bs-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.cf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.bs-g{margin-bottom:12px}
.bs-h{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:6px 0;border-bottom:1px solid var(--line2)}
.bs-r{display:flex;justify-content:space-between;padding:8px 2px 8px 10px;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
.bs-r:hover{background:var(--tint)}
.ratio-list>div{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ratio-list .t{flex:1;min-width:0}.ratio-list .t b{display:block;font-size:13px}.ratio-list .t small{color:var(--muted);font-size:11.5px}
.ratio-list .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}.ratio-list .dot.ok{background:var(--green)}.ratio-list .dot.bad{background:var(--pink)}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.cmp b{text-align:right}.cmp.head b{font-size:11px;color:var(--muted);text-transform:uppercase}
@media (max-width:1320px){.cfo-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.bs-grid{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.cfo-kpis,.bs-grid,.cf-grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.cfo-kpis,.bs-grid,.cf-grid{grid-template-columns:1fr}}
/* ---------- Excel-like grid ---------- */
.grid-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}
.gstat{font-size:12.5px;color:var(--muted)}.gdirty{color:#b45309}
table.gridt{font-size:12.5px}
table.gridt th{cursor:default;padding:9px 8px;background:var(--tint2);border-right:1px solid var(--line)}
table.gridt th.ro{color:var(--muted);font-style:italic}
table.gridt td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:34px}
table.gridt td[data-ro],table.gridt td.ro{background:var(--tint);padding:0 10px;color:var(--ink-2)}
table.gridt tbody tr:hover td{background:inherit}
table.gridt td.gn,table.gridt th.gn{width:34px;text-align:center;color:var(--muted);background:var(--tint2);font-size:11px;padding:0}
table.gridt td.gx{padding:0 4px;border-right:0}
.gi{width:100%;height:34px;border:0;outline:0;background:transparent;padding:0 9px;font:inherit;color:var(--ink);border-radius:0}
select.gi{padding-right:4px;cursor:pointer}
.gi.n{text-align:right;font-variant-numeric:tabular-nums}
.gi:focus{box-shadow:inset 0 0 0 2px var(--violet);background:var(--card)}
.gi.dirty{background:#fff7d6}
body.dark .gi.dirty{background:#3a3210}
tr.gnew td.gc{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--tint) 6px 7px)}
tr.gerr td{box-shadow:inset 0 -2px 0 var(--pink)}
.req-star{color:var(--pink)}
.grid-help{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}

/* ---------- Calculator ---------- */
.round-btn.on{background:var(--violet);color:#fff}
.calc-chip{position:absolute;z-index:450;display:flex;border-radius:7px;overflow:hidden;box-shadow:0 3px 10px rgba(40,30,120,.28)}
.calc-chip button{border:0;width:22px;height:22px;display:grid;place-items:center;font-weight:800;font-size:14px;line-height:1;color:#fff;padding:0;cursor:pointer}
.calc-chip .p{background:var(--violet)}
.calc-chip .m{display:none;background:#f43f6b}
.calc-chip.open .p{background:#14b8a6}
.calc-chip.open .m{display:grid}
.calc-flash{position:absolute;z-index:460;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;pointer-events:none;animation:cflash 1.3s ease forwards}
.calc-flash.p{background:#e6fbf7;color:#0f766e}.calc-flash.m{background:#ffe4e6;color:#be123c}
@keyframes cflash{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.calcw{position:fixed;right:22px;bottom:22px;width:330px;max-width:calc(100vw - 24px);background:var(--card);color:var(--ink);border-radius:20px;box-shadow:0 24px 60px rgba(20,15,70,.32);z-index:420;overflow:hidden;border:1px solid var(--line)}
.calc-h{display:flex;align-items:center;gap:8px;padding:11px 10px 11px 14px;background:linear-gradient(135deg,var(--violet),var(--violet-d));color:#fff;cursor:move;user-select:none;touch-action:none}
.calc-h .t{flex:1;min-width:0}.calc-h b{display:block;font-size:13.5px}.calc-h small{display:block;opacity:.8;font-size:10.5px}
.calc-h button{width:28px;height:28px;border-radius:8px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-weight:700;padding:0}
.calc-h button:hover{background:rgba(255,255,255,.28)}
.calc-h .ci,.calc-pill .ci{display:grid;place-items:center}
.tape{max-height:200px;overflow:auto;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--tint)}
.tape-empty{font-size:12px;color:var(--muted);padding:12px 4px;line-height:1.45}
.tp-r{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.tp-r:last-child{border-bottom:0}
.tp-r .sg{width:22px;height:22px;border-radius:6px;border:0;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;padding:0;flex:0 0 22px}
.tp-r .sg.p{background:#14b8a6}.tp-r .sg.m{background:#f43f6b}.tp-r .sg.x{background:var(--violet)}
.tp-r .t{flex:1;min-width:0}.tp-r .t b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tp-r .t small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-r .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tp-r .x{border:0;background:none;color:var(--muted);padding:2px;display:grid;place-items:center}
.tp-r .x:hover{color:var(--pink)}
.disp{padding:10px 16px 4px;text-align:right}
.disp small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp b{display:block;font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp .pend{color:var(--violet)}
.disp em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 12px 10px}
.keys button{height:38px;border-radius:11px;border:0;background:var(--tint2);font-weight:700;font-size:15px;color:var(--ink);padding:0}
.keys button:hover{filter:brightness(.96)}.keys button:active{transform:translateY(1px)}
.keys .op{background:var(--violet-l);color:var(--violet)}.keys .op.on{background:var(--violet);color:#fff}
.keys .eq{background:var(--violet);color:#fff}.keys .c{background:#ffe4e6;color:#be123c}
.calc-f{display:flex;gap:6px;padding:0 12px 12px}
.calc-f button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:700;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.calc-f button:first-child{flex:1.6}
.calc-f button:hover{border-color:var(--violet);color:var(--violet)}
.calc-pill{position:fixed;right:22px;bottom:22px;z-index:420;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:99px;background:linear-gradient(135deg,var(--violet),var(--violet-d));color:#fff;box-shadow:0 14px 34px rgba(40,30,160,.35);cursor:pointer}
.calc-pill .ci{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18)}
.calc-pill small{display:block;opacity:.8;font-size:10.5px}.calc-pill b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.calc-pill .cp{width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;padding:0}
.calc-pill.pulse{animation:cpulse .5s ease}
@keyframes cpulse{50%{transform:scale(1.08)}}
.toasts{z-index:470}
body.calc-on .toasts{bottom:auto;top:84px}
body.privacy .disp b,body.privacy .tp-r .v,body.privacy .calc-pill b{filter:blur(7px)}
@media (max-width:600px){.calcw{right:12px;bottom:12px}.calc-pill{right:12px;bottom:12px}}

/* ---------- Account Balances strip ---------- */
.bal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.bal{border:1px solid var(--line);background:var(--tint);border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0;transition:border-color .15s,transform .1s}
.bal:hover{border-color:var(--violet);transform:translateY(-1px)}
.bal.tot{background:var(--violet-l);border-color:transparent}
.bal-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bal-h .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:0 0 26px}
.bal-h .l{font-size:12px;font-weight:600;color:var(--ink-2);min-width:0;line-height:1.15}
.bal-h .l em{display:block;font-style:normal;font-weight:500;font-size:10.5px;color:var(--muted)}
.bal>b{display:block;font-size:19px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal-s{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11px;color:var(--muted)}
.bal-s i{font-style:normal;font-weight:700;color:var(--ink-2)}
.tile-sum{cursor:pointer;border:1px dashed var(--line2)}
.tile-sum:hover{border-color:var(--violet)}

.bal{position:relative}
.bal-grid.editing .bal{cursor:grab;outline:2px dashed var(--line2);outline-offset:2px;padding-top:34px}
.bal-grid.editing .bal:hover{transform:none}
.bal.dragging{opacity:.35}
.bal.drop-before{box-shadow:-7px 0 0 -2px var(--violet)}
.bal.drop-after{box-shadow:7px 0 0 -2px var(--violet)}
.bal-ctl{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:3px;align-items:center}
.bal-ctl .grip{flex:1;color:var(--muted);display:flex}
.bal-ctl button{width:22px;height:22px;border-radius:6px;border:0;background:var(--card);color:var(--ink-2);display:grid;place-items:center;padding:0;box-shadow:var(--shadow)}
.bal-ctl button:hover{background:var(--violet);color:#fff}
.bal-tray{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;font-size:12.5px}
.bal-tray .chip-add{margin:0}
.bal-tray .chip-add.new{border-style:solid;border-color:var(--violet);color:var(--violet);background:var(--violet-l)}
.bal-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.field .bal-pick input{width:16px;height:16px;min-height:0;padding:0;margin:0;flex:0 0 16px;box-shadow:none}
.field .bal-pick label span{text-align:left;font-weight:600;color:var(--ink)}
.field .bal-pick label{display:flex;margin:0;text-transform:none;letter-spacing:0;justify-content:flex-start;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;cursor:pointer}
.bal-pick label span{flex:1}
.bal-pick label:has(input:checked){border-color:var(--violet);background:var(--violet-l)}

/* ---------- Bonus redemptions ---------- */
.rd-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rd-sum>div{background:var(--tint);border-radius:12px;padding:10px 12px}
.rd-sum small{display:block;color:var(--muted);font-size:11px}.rd-sum b{display:block;font-size:17px}
.link-btn{border:0;background:none;padding:0;color:var(--violet);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.link-btn.strong{font-size:13px;font-weight:700;color:var(--ink)}
.link-btn:hover{text-decoration:underline;color:var(--violet)}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;cursor:pointer}
label.chk input{width:16px;height:16px}
/* ---------- Price charts ---------- */
.px.click,.owner.click,.stk-name.click{cursor:pointer}
.px.click:hover{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet-l)}
.owner.click:hover b,.stk-name.click:hover b{color:var(--violet);text-decoration:underline}

/* ======================================================================
   v4.7 — ATLAS DESIGN SYSTEM (default theme · light + dark)
   Neutral surfaces, hairline borders, one cobalt accent, Inter with
   tabular figures. Scoped to body.atlas so the other templates keep working.
   ====================================================================== */
body[data-theme="atlas"]{
  --violet:#3e63dd;--violet-d:#2f4fc4;--violet-l:#eef2fe;--violet-2:#5b7cf0;
  --orange:#e8833a;--orange-l:#fdf1e7;--yellow:#d4a72c;--yellow-l:#fbf5df;--pink:#e5484d;--pink-l:#fdeeee;
  --green:#14915f;--green-l:#e8f6ef;--teal:#12a594;--sky:#0ea5e9;--gold:#c99a1c;
  --bg:#f6f7f9;--card:#ffffff;--ink:#0f172a;--ink-2:#374151;--muted:#6b7280;--line:#e9ebef;--line2:#dfe2e7;
  --tint:#f8f9fb;--tint2:#f1f3f6;--font:Inter;--radius:14px;
  --side-bg:#fbfbfc;--side-ink:#0f172a;--side-ink2:#4b5563;--side-hover:#f0f2f5;--side-hover2:#e8ebf0;
  --shadow:0 1px 2px rgba(15,23,42,.04);--shadow-lg:0 24px 48px -12px rgba(15,23,42,.22),0 0 0 1px rgba(15,23,42,.04);
  --sidebar:252px;--ring:rgba(62,99,221,.28);--warn:#b45309;--warn-l:#fff5e6;--ok:#14915f;--ok-l:#e8f6ef;--bad:#d1343b;--bad-l:#fdeeee;
}
body[data-theme="atlasdark"]{
  --violet:#7b93ff;--violet-d:#91a6ff;--violet-l:#1a2140;--violet-2:#9aaeff;
  --orange:#f0a35e;--orange-l:#2a1d12;--yellow:#e6c35c;--yellow-l:#2a2412;--pink:#ff6b70;--pink-l:#2c1517;
  --green:#3ccf91;--green-l:#0f2a1f;--teal:#2ec4a9;--sky:#38bdf8;--gold:#e6c35c;
  --bg:#0a0c10;--card:#12151c;--ink:#e9ecf3;--ink-2:#c3c9d6;--muted:#8b93a7;--line:#1e232e;--line2:#2a3040;
  --tint:#161a23;--tint2:#1b202b;--font:Inter;--radius:14px;
  --side-bg:#0d1016;--side-ink:#e9ecf3;--side-ink2:#9aa3b5;--side-hover:#161b25;--side-hover2:#1d2330;
  --shadow:0 0 0 1px rgba(255,255,255,.015);--shadow-lg:0 30px 60px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);
  --sidebar:252px;--ring:rgba(123,147,255,.35);--warn:#f5b45c;--warn-l:#2a2010;--ok:#3ccf91;--ok-l:#0f2a1f;--bad:#ff7b80;--bad-l:#2c1517;
}
body.atlas{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13.5px;letter-spacing:-.003em;font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums}

body.atlas .nav-item:hover{background:var(--side-hover);color:var(--ink)}
body.atlas .nav-item.active{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(15,23,42,.05)}

body.atlas .nav-item.active::before,body.atlas .nav-item.active::after{display:none}
body.atlas .nav-item .count{background:transparent;color:var(--muted);font-weight:600;padding:0;margin-right:2px;font-size:11.5px}
body.atlas .nav-item .count.on{background:var(--ok-l);color:var(--ok);padding:1px 7px}
body.atlas .nav-item.active .count{background:transparent;color:var(--muted)}
body.atlas .sidebar-foot{padding:10px 0 0;border-top:1px solid var(--line);margin-top:auto;gap:1px}
body.atlas.dark .nav-item.active{box-shadow:0 0 0 1px var(--line2)}
/* collapsed rail */
body.atlas.nav-collapsed{--sidebar:68px}
body.atlas.nav-collapsed .sidebar{padding-left:10px;padding-right:10px;align-items:stretch}
body.atlas.nav-collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
body.atlas.nav-collapsed .brand-text,body.atlas.nav-collapsed .nav-item .lbl,body.atlas.nav-collapsed .nav-item .count{display:none}
body.atlas.nav-collapsed .nav-label{font-size:0;padding:8px 0 4px;margin:6px 10px 0;border-top:1px solid var(--line)}
body.atlas.nav-collapsed .nav-item{justify-content:center;padding:9px 0}
body.atlas.nav-collapsed #navCollapse .ico{transform:rotate(180deg)}
#navCollapse .ico{transition:transform .2s}

/* ---- header ---- */
body.atlas .topbar{position:sticky;top:0;z-index:25;padding:12px 28px;gap:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(10px);-webkit-backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line)}
body.atlas .hello{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden}
body.atlas .hello b{color:var(--ink-2);font-weight:600}
body.atlas .hello svg{opacity:.55}
body.atlas .titles{flex:1 1 240px;min-width:200px}
body.atlas .topbar h1{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.atlas .top-actions{gap:8px}
body.atlas .search{width:300px;padding:0 12px;height:36px;border-radius:10px;border:1px solid var(--line2);box-shadow:none;background:var(--card);transition:border-color .15s,box-shadow .15s}
body.atlas .search:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px var(--ring)}
body.atlas .search input{font-size:13px}
body.atlas .round-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);box-shadow:none;background:var(--card);color:var(--ink-2);transition:background .12s,color .12s,border-color .12s}
body.atlas .round-btn:hover{background:var(--tint2);color:var(--ink)}
body.atlas .round-btn svg{width:17px;height:17px}
body.atlas .round-btn .dot{top:-5px;right:-5px;border-color:var(--bg);background:var(--bad)}
body.atlas .qa-btn{border-color:transparent!important}
body.atlas .user-chip{box-shadow:none;border:1px solid var(--line2);border-radius:10px;padding:3px 10px 3px 3px;height:36px}
body.atlas .user-chip .av{border-radius:7px;width:28px;height:28px;background:linear-gradient(140deg,var(--violet),#7b5cf0)!important}
body.atlas .chips.ccy{box-shadow:none;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:2px;height:36px;align-items:center}
body.atlas .toolbar{padding:16px 28px 0}
body.atlas .view{padding:16px 28px 36px}
body.atlas .foot{padding:0 28px 22px}

/* ---- buttons, chips, segmented ---- */
body.atlas .btn{border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.1),inset 0 1px 0 rgba(255,255,255,.12);transition:background .12s,transform .06s,box-shadow .12s}
body.atlas .btn:hover{background:var(--violet-d)}
body.atlas.dark .btn:not(.ghost):not(.danger){color:#0b0e1a}
body.atlas .btn.ghost{background:var(--card);border:1px solid var(--line2);color:var(--ink-2);box-shadow:0 1px 2px rgba(15,23,42,.04)}
body.atlas .btn.ghost:hover{background:var(--tint2);color:var(--ink)}
body.atlas .btn.danger{border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad)}
body.atlas .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
body.atlas .btn.orange{background:var(--ink);color:var(--card);box-shadow:none}
body.atlas .icon-btn{border-radius:8px;width:30px;height:30px}
body.atlas .icon-btn:hover{background:var(--tint2);color:var(--ink)}
body.atlas .chips{background:var(--tint2);box-shadow:none;border-radius:10px;padding:3px;gap:2px}
body.atlas .chip{border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:550;color:var(--muted);transition:background .12s,color .12s}
body.atlas .chip:hover{color:var(--ink)}
body.atlas .chip.active,body.atlas .chips.light .chip.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08),0 0 0 1px var(--line)}
body.atlas .link{color:var(--violet)}

/* ---- surfaces ---- */
body.atlas .card{border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px}
body.atlas .card-h{margin-bottom:14px}
body.atlas .card-h h3{font-size:14px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
body.atlas .card-h h3 svg{color:var(--muted)}
body.atlas .card-h .sub{font-size:12px}
body.atlas .tile{border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 16px;gap:12px}
body.atlas .tile .ic,body.atlas .kpi .ic{width:34px;height:34px;flex-basis:34px;border-radius:9px}
body.atlas .tile .ic svg,body.atlas .kpi .ic svg{width:17px;height:17px}
body.atlas .tile .l,body.atlas .kpi .lbl{font-size:12px;font-weight:500}
body.atlas .tile .v{font-size:19px;font-weight:650;letter-spacing:-.02em}
body.atlas .kpi .val{font-size:21px;font-weight:650;letter-spacing:-.02em}
body.atlas .kpi:hover,body.atlas .person:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
body.atlas .i-violet{background:var(--violet)} body.atlas .i-gold{background:var(--gold)}
body.atlas .hero{background:radial-gradient(120% 120% at 100% 0%,#33468f 0%,#1b2552 45%,#0f1530 100%);border:0}
body.atlas.dark .hero{background:radial-gradient(120% 120% at 100% 0%,#26346f 0%,#151c3d 50%,#0d1226 100%);box-shadow:0 0 0 1px var(--line2)}
body.atlas .hero .big{font-size:36px;font-weight:650;letter-spacing:-.03em}
body.atlas .tile.cash{background:linear-gradient(135deg,#1b2552,#3e63dd);box-shadow:0 10px 24px -10px var(--ring)}
body.atlas .popover{border:1px solid var(--line);border-radius:14px}
body.atlas .banner{border-radius:10px;border:1px solid transparent}
body.atlas .alert{border-radius:10px;background:var(--tint);border:1px solid var(--line)}
body.atlas .px{border-radius:12px}
body.atlas .empty{color:var(--muted)}
/* physical-card visuals (dashboard): calmer, premium finishes */
body.atlas .cc{border-radius:14px;box-shadow:0 12px 24px -12px rgba(15,23,42,.45)}
body.atlas .cc::before{background:rgba(255,255,255,.06)} body.atlas .cc::after{background:rgba(255,255,255,.04)}
body.atlas .g0{background:linear-gradient(135deg,#1f2a5c,#3e63dd)} body.atlas .g1{background:linear-gradient(135deg,#2b2f36,#4b5263)}
body.atlas .g2{background:linear-gradient(135deg,#0f3d3a,#12a594)} body.atlas .g3{background:linear-gradient(135deg,#3a2350,#7b5cf0)}
body.atlas .g4{background:linear-gradient(135deg,#4a2f14,#c08443)} body.atlas .g5{background:linear-gradient(135deg,#1d2433,#3c4a63)}

/* ---- tables ---- */
body.atlas .table-card{border-radius:var(--radius)}
body.atlas table.data th{background:var(--tint);color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:10px 14px;border-bottom:1px solid var(--line)}
body.atlas table.data td{padding:10px 14px;border-bottom:1px solid var(--line)}
body.atlas table.data tbody tr{transition:background .1s}
body.atlas table.data tbody tr:hover td{background:var(--tint)}
body.atlas table.data tfoot td{background:var(--tint2);color:var(--ink);border-top:1px solid var(--line2)}
body.atlas .acct{font-weight:600}

/* ---- forms, modal, toast ---- */
body.atlas .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
body.atlas .field input,body.atlas .field select,body.atlas .field textarea{border:1px solid var(--line2);border-radius:9px;padding:9px 11px;background:var(--card)}
body.atlas .field input:focus,body.atlas .field select:focus,body.atlas .field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--ring)}
body.atlas .modal-back{background:rgba(15,23,42,.42);backdrop-filter:blur(3px)}
body.atlas .modal{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
body.atlas .modal-head{padding:16px 20px}
body.atlas .modal-head h2{font-size:16px;font-weight:650;letter-spacing:-.01em}
body.atlas .modal-body{padding:18px 20px}
body.atlas .form-actions{border-top:1px solid var(--line)}
body.atlas .toast{border-radius:10px;font-size:13px;padding:10px 14px;background:var(--ink);color:var(--card)}
body.atlas .toast.ok{background:var(--ink)} body.atlas .toast.err{background:var(--bad);color:#fff}
body.atlas .chart .tip{background:var(--ink);color:var(--card);border-radius:8px;box-shadow:var(--shadow-lg)}
body.atlas .chart .tip::after{border-top-color:var(--ink)}
body.atlas .spinner{border-width:3px;width:32px;height:32px}
body.atlas .loading{background:color-mix(in srgb,var(--bg) 50%,transparent)}

/* ---- responsive shell ---- */
@media (max-width:1560px){body.atlas .search{width:220px}body.atlas .user-chip .who{display:none}body.atlas .user-chip{padding:3px}}
@media (max-width:1200px){body.atlas .search{width:170px}body.atlas .chips.ccy{display:none}}
@media (max-width:900px){
  body.atlas .topbar{padding:10px 14px}
  body.atlas .toolbar{padding:12px 14px 0} body.atlas .view{padding:12px 14px 28px} body.atlas .foot{padding:0 14px 18px}
  body.atlas .sidebar{width:272px;flex-basis:272px}
  body.atlas.nav-collapsed .sidebar .lbl,body.atlas.nav-collapsed .brand-text{display:inline}
  body.atlas #navCollapse{display:none}
  body.atlas .top-actions #themeBtn,body.atlas .top-actions #calBtn,body.atlas .top-actions #calcBtn2{display:none}
}
@media (max-width:600px){
  body.atlas .hello{display:none}
  body.atlas .topbar h1{font-size:17px}
  body.atlas .top-actions{gap:6px}
  body.atlas .top-actions #privBtn,body.atlas .user-chip,body.atlas .top-actions #adminBtn{display:none}
  body.atlas .round-btn{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ======================================================================
   CREDIT CARD ACCOUNTS (works with every template, tuned for Atlas)
   ====================================================================== */
.cc-ov{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2fr);gap:14px;margin-bottom:14px}
.ov-main{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.ov-bal small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.ov-bal b{display:block;font-size:34px;font-weight:700;letter-spacing:-.03em;margin:4px 0 6px;color:var(--ink)}
.ov-bal span{font-size:12px;color:var(--muted)}
.ov-bal em{font-style:normal;font-weight:600}
.ov-bal em.bad{color:var(--pink)}
.ov-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ov-k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.ov-k[data-ccd]{cursor:pointer;transition:border-color .12s,transform .12s}
.ov-k[data-ccd]:hover{border-color:var(--line2);transform:translateY(-1px)}
.ov-k small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.ov-k b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em;margin:3px 0 2px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-k span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-k.warn{box-shadow:inset 3px 0 0 var(--orange),var(--shadow)}
/* utilization ring + bar (ex/gd/md/hi) */
.ring{position:relative;width:var(--s);height:var(--s);flex:0 0 var(--s)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round}
.ring .tr{stroke:var(--tint2)}
.ring .pr{transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c b{font-size:calc(var(--s) * .2);font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.ring-c small{font-size:10.5px;color:var(--muted);font-weight:500}
.ring.ex .pr,.ubar.ex i{stroke:#14915f;background:#14915f} .ring.gd .pr,.ubar.gd i{stroke:#3e9e6a;background:#58b37f}
.ring.md .pr,.ubar.md i{stroke:#d08a1e;background:#e2a03a} .ring.hi .pr,.ubar.hi i{stroke:#d1343b;background:#e5484d} .ring.na .pr{stroke:transparent}
.ubar{position:relative;height:6px;border-radius:99px;background:var(--tint2);overflow:hidden;flex:1;min-width:60px}
.ubar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;animation:ugrow .7s cubic-bezier(.2,.8,.2,1) both}
.ubar s{position:absolute;top:0;bottom:0;width:1px;background:var(--card);opacity:.9}
@keyframes ugrow{from{width:0}}
span.ex{color:#14915f} span.gd{color:#2f8a57} span.md{color:#b7700f} span.hi{color:var(--pink)} span.na{color:var(--muted)}
/* attention + hint strips */
.cc-att,.cc-hint{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.cc-att{background:var(--orange-l);color:var(--ink-2);border:1px solid color-mix(in srgb,var(--orange) 25%,transparent)}
.cc-att>svg{color:var(--orange);margin-top:3px;flex:none}
.cc-att .lnk{border:0;background:none;padding:0 8px 0 0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 25%,transparent);text-underline-offset:3px}
.cc-att .lnk em{font-style:normal;font-weight:500;color:var(--muted)}
.cc-hint{background:var(--tint);border:1px dashed var(--line2);color:var(--muted);margin-top:14px}
.cc-hint>svg{margin-top:3px;flex:none}
/* controls */
.cc-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:2px 0 14px}
.cc-ctl-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.seg2{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--tint2);border-radius:10px;padding:3px}
.seg2 button{white-space:nowrap;border:0;background:none;border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:550;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:background .12s,color .12s}
.seg2 button span{font-size:11px;color:var(--muted);opacity:.8;font-weight:600}
.seg2 button:hover{color:var(--ink)}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08),0 0 0 1px var(--line)}
.seg2.sm button{font-size:12px;padding:4px 10px}
.selx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:9px;padding:0 8px;height:32px;background:var(--card);color:var(--muted)}
.selx select{border:0;background:none;outline:0;font-size:12.5px;font-weight:550;color:var(--ink);padding:0 2px;cursor:pointer}
.vt{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;height:32px}
.vt button{border:0;background:var(--card);color:var(--muted);width:34px;display:grid;place-items:center}
.vt button+button{border-left:1px solid var(--line2)}
.vt button.on{background:var(--tint2);color:var(--ink)}
.ut-set{position:relative}
.ut-set summary{list-style:none;cursor:pointer}
.ut-set summary::-webkit-details-marker{display:none}
.ut-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:250px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.ut-pop small{color:var(--muted);margin-top:-6px}
.ut-pop label{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.ut-pop input{width:56px;border:1px solid var(--line2);border-radius:7px;padding:4px 6px;background:var(--card);color:var(--ink);margin-left:auto;text-align:right}
/* account tiles */
.acx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.acx{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,transform .15s;outline:none}
.acx:hover,.acx:focus-visible{border-color:var(--line2);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.acx.att::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:2px;border-radius:0 0 2px 2px;background:var(--orange)}
.acx.closed{opacity:.6}
.acx header{display:flex;align-items:center;gap:10px;min-width:0}
.iss{--sz:34px;width:var(--sz);height:var(--sz);flex:0 0 var(--sz);border-radius:calc(var(--sz) * .28);display:grid;place-items:center;font-size:calc(var(--sz) * .34);font-weight:700;letter-spacing:.02em;color:#fff;background:linear-gradient(145deg,var(--iss),color-mix(in srgb,var(--iss) 70%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.acx .nm{flex:1;min-width:0}
.acx .nm b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx .nm small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--tint2);color:var(--muted);white-space:nowrap}
.st.s-paid{background:var(--green-l);color:var(--green)} .st.s-unpaid{background:var(--pink-l);color:var(--pink)} .st.s-scheduled{background:var(--violet-l);color:var(--violet)}
.acx-bal{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.acx-bal small,.acx .f small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.acx-bal b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1.15}
.acx-bal b.zero{color:var(--muted)}
.acx-av{text-align:right}
.acx-av b{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2)}
.acx-ut{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600}
.acx-ut span{white-space:nowrap}
.acx .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.acx .f b{display:block;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx .f b i{font-style:normal;color:var(--muted);margin-left:2px}
.acx .f.warn b{color:var(--orange)} .acx .f.bad b{color:var(--pink)}
.acx footer{display:flex;flex-wrap:wrap;gap:6px;min-height:20px}
.acx footer:empty{display:none}
.tagx{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--tint2);color:var(--ink-2);white-space:nowrap}
.tagx.promo{background:var(--violet-l);color:var(--violet)} .tagx.ok{background:var(--green-l);color:var(--green)}
.tagx.warn{background:var(--orange-l);color:#b45309} .tagx.bad{background:var(--pink-l);color:var(--pink)}
body.dark .tagx.warn{color:var(--orange)}
/* list view */
.cc-tbl td{cursor:pointer}
.cc-tbl tr.closed td{opacity:.55}
.cl-n{display:flex;align-items:center;gap:10px}
.cl-n b{display:block;font-weight:600;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.cl-n small{display:block;color:var(--muted);font-size:11.5px}
.cl-u{display:flex;align-items:center;gap:8px;min-width:120px}
.cl-u span{font-size:12px;font-weight:600;width:38px;text-align:right}
.warn-t{color:var(--orange);font-weight:600}
/* planning tools */
.cc-tools{margin-top:22px}
.sec-h{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.sec-h h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.cc-tools .card{margin-bottom:14px}
/* detail drawer */
.drawer-back{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:80;animation:fadein .15s ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:81;display:flex;flex-direction:column;animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}}
.dr-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-h .nm{flex:1;min-width:0}
.dr-h .nm b{display:block;font-size:16px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.dr-h .nm small{display:block;font-size:12px;color:var(--muted)}
.dr-body{flex:1;overflow:auto;padding:18px}
.dr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.dr-top small{display:block;color:var(--muted);font-size:12px}
.dr-top>div>b{display:block;font-size:32px;font-weight:700;letter-spacing:-.03em;color:var(--ink);margin:2px 0 8px}
.dr-top span .tagx{margin:0 4px 4px 0}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.dr-f{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.dr-f small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.dr-f b{display:block;font-size:15px;font-weight:650;color:var(--ink);margin:2px 0 1px;letter-spacing:-.01em}
.dr-f span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-sec{margin-bottom:18px}
.dr-sec h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.dr-tx>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dr-tx>div:last-child{border-bottom:0}
.dr-tx span{min-width:0}
.dr-tx span b{display:block;font-size:13px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-tx span small{font-size:11.5px;color:var(--muted)}
.dr-tx>div>b{font-size:13px;white-space:nowrap}
.dr-empty{font-size:12.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line2);border-radius:10px;background:var(--tint)}
.dr-f2{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--tint)}
.dr-f2 .doc-btn span{position:static;margin-left:4px}
body.privacy .ov-bal b,body.privacy .ov-k b,body.privacy .acx-bal b,body.privacy .acx .f b,body.privacy .dr-top>div>b,body.privacy .dr-f b,body.privacy .cc-tbl td.num,body.privacy .ring-c b{filter:blur(7px)}

table.data th.xh::after{content:"yours";margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--violet);opacity:.8}

.dr-all>div{background:var(--card);padding:8px 10px;min-width:0}
.dr-all small{display:block;font-size:10.5px;color:var(--muted)}
.dr-all b{display:block;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-all .mine small{color:var(--violet)}

.colck{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}

.colck .ck-ok,.colck .ck-bad,.colck .ck-warn{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:4px 0;color:var(--ink-2)}

.gm-test{margin-top:16px;border:1px solid var(--line,rgba(127,127,127,.2));border-radius:12px;padding:10px 12px}

.gm-test .form-grid{margin:10px 0}

        (pts[i + 1][0] - dx).toFixed(1) + ',' + (pts[i + 1][1] - m[i + 1] * dx).toFixed(1) + ' ' +
        pts[i + 1][0].toFixed(1) + ',' + pts[i + 1][1].toFixed(1);
    }
    return p;
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }

  function drawArea(el, cfg) {
    const W = el.clientWidth, Hh = el.clientHeight || 280;
    const padL = 54, padR = 12, padT = 18, padB = 30;
    const w = W - padL - padR, h = Hh - padT - padB;
    const pts = cfg.points;
    const xs = pts.map(function (p) { return p.t != null ? p.t : parseISO(p.date).getTime(); });
    const x0 = xs[0], x1 = xs[xs.length - 1] === x0 ? x0 + 86400000 : xs[xs.length - 1];
    let lo = Infinity, hi = -Infinity;
    cfg.series.forEach(function (s) { pts.forEach(function (p) { lo = Math.min(lo, p[s.key]); hi = Math.max(hi, p[s.key]); }); });
    if (cfg.ref) { lo = Math.min(lo, cfg.ref.value); hi = Math.max(hi, cfg.ref.value); }
    if (lo === hi) { lo -= Math.abs(lo) * 0.1 + 1; hi += Math.abs(hi) * 0.1 + 1; }
    const step = niceStep((hi - lo) / 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const X = function (t) { return padL + (t - x0) / (x1 - x0) * w; };
    const Y = function (v) { return padT + (1 - (v - lo) / (hi - lo)) * h; };

    let svg = '<svg width="' + W + '" height="' + Hh + '"><defs>';
    cfg.series.forEach(function (s, i) {
      svg += '<linearGradient id="g_' + el.id + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + s.color + '" stop-opacity=".28"/><stop offset="1" stop-color="' + s.color + '" stop-opacity="0"/></linearGradient>';
    });
    svg += '</defs>';
    for (let v = lo; v <= hi + 1e-6; v += step) {
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#efeef6"/>' +
        '<text x="' + (padL - 10) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="#9a99b3">' + (cfg.axisFmt || shortMoney)(v) + '</text>';
    }
    const ticks = Math.max(2, Math.min(7, pts.length, Math.floor(w / 75)));
    const spanDays = (x1 - x0) / 86400000;
    for (let i = 0; i < ticks; i++) {
      const t = x0 + (x1 - x0) * (ticks === 1 ? 0 : i / (ticks - 1));
      const d = new Date(t);
      const lab = spanDays < 3 ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : spanDays < 10 ? d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }) : spanDays > 1100 ? String(d.getFullYear()) : spanDays > 300 ? d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      svg += '<text x="' + X(t) + '" y="' + (Hh - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === ticks - 1 ? 'end' : 'middle') + '" font-size="11" fill="#9a99b3">' + lab + '</text>';
    }
    if (cfg.ref) svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(cfg.ref.value) + '" y2="' + Y(cfg.ref.value) + '" stroke="' + cfg.ref.color + '" stroke-width="2" stroke-dasharray="6 5"/>';
    cfg.series.slice().reverse().forEach(function (s, ri) {
      const i = cfg.series.length - 1 - ri;
      const line = pts.map(function (p, j) { return [X(xs[j]), Y(p[s.key])]; });
      const path = monoPath(line);
      svg += '<path d="' + path + 'L' + line[line.length - 1][0] + ',' + (padT + h) + 'L' + line[0][0] + ',' + (padT + h) + 'Z" fill="url(#g_' + el.id + i + ')"/>';
      svg += '<path d="' + path + '" fill="none" stroke="' + s.color + '" stroke-width="3" stroke-linecap="round"/>';
    });
    svg += '<line class="hl" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + h) + '" stroke="#b9b2ff" stroke-dasharray="4 4" opacity="0"/>';
    cfg.series.forEach(function (s, i) { svg += '<circle class="hd' + i + '" r="6" fill="#fff" stroke="' + s.color + '" stroke-width="3" opacity="0"/>'; });
    svg += '<rect x="' + padL + '" y="' + padT + '" width="' + w + '" height="' + h + '" fill="transparent" class="hov"/></svg>';
    el.innerHTML = recolor(svg, true) + '<div class="tip" hidden></div>';

    const tip = el.querySelector('.tip'), hl = el.querySelector('.hl'), hov = el.querySelector('.hov');
    function show(clientX) {
      const r = el.getBoundingClientRect(), mx = clientX - r.left;
      let best = 0, bd = Infinity;
      xs.forEach(function (t, j) { const dd = Math.abs(X(t) - mx); if (dd < bd) { bd = dd; best = j; } });
      const p = pts[best], px = X(xs[best]);
      hl.setAttribute('x1', px); hl.setAttribute('x2', px); hl.setAttribute('opacity', 1);
      cfg.series.forEach(function (s, i) {
        const c = el.querySelector('.hd' + i);
        c.setAttribute('cx', px); c.setAttribute('cy', Y(p[s.key])); c.setAttribute('opacity', 1);
      });
      tip.hidden = false;
      tip.innerHTML = cfg.tip ? cfg.tip(p) : '<b>' + money(p[cfg.series[0].key], true) + '</b><span>' + fmtDate(p.date) + '</span>' +
        cfg.series.slice(1).map(function (s) { return '<div style="margin-top:3px;opacity:.9">' + esc(s.label) + ': ' + money(p[s.key], true) + '</div>'; }).join('');
      tip.style.left = Math.min(Math.max(px, cfg.tip ? 110 : 70), W - (cfg.tip ? 110 : 70)) + 'px';
      tip.style.top = Y(p[cfg.series[0].key]) + 'px';
    }
    function hide() {
      tip.hidden = true; hl.setAttribute('opacity', 0);
      cfg.series.forEach(function (s, i) { el.querySelector('.hd' + i).setAttribute('opacity', 0); });
    }
    hov.addEventListener('mousemove', function (e) { show(e.clientX); });
    hov.addEventListener('touchstart', function (e) { show(e.touches[0].clientX); }, { passive: true });
    hov.addEventListener('mouseleave', hide);
  }

  function drawSpark(el, cfg) {
    const W = el.clientWidth, Hh = el.clientHeight || 70, v = cfg.values;
    if (v.length < 2) { el.innerHTML = ''; return; }
    let lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);

    const pts = v.map(function (x, i) { return [4 + i / (v.length - 1) * (W - 8), 6 + (1 - (x - lo) / (hi - lo)) * (Hh - 12)]; });
    const path = monoPath(pts);
    el.innerHTML = recolor('<svg width="' + W + '" height="' + Hh + '"><defs><linearGradient id="sg_' + el.id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + cfg.color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + cfg.color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + path + 'L' + pts[pts.length - 1][0] + ',' + Hh + 'L' + pts[0][0] + ',' + Hh + 'Z" fill="url(#sg_' + el.id + ')"/>' +

  const HRANGES = [{ k: '1W', d: 7 }, { k: '1M', d: 30 }, { k: '3M', d: 91 }, { k: '1Y', d: 365 }, { k: 'ALL', d: 100000, l: 'All' }, { k: 'C', l: 'Custom' }];

  const BALH = {};      // cache: table key → server per-account history
  function histKey(view) { return isStockView(view) ? 'stocks' : view; }
  function loadBalHist(key) {
    if (BALH[key] || BALH['_' + key]) return;
    BALH['_' + key] = 1;
    const keys = key === 'mortgage' ? ['mortgage', 'mortgageHome'] : [key];
    Promise.all(keys.map(function (k) { return call('getBalanceHistory', k); })).then(function (res) {
      res.forEach(function (r, i) { BALH[keys[i]] = r; });
      delete BALH['_' + key];
